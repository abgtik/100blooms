<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>100 Blooms Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;500;600;700&display=swap">
<script>try{const k=localStorage.getItem('hb_skin');if(k&&k!=='bunga')document.documentElement.dataset.skin=k}catch(e){}</script>
<style>
:root{--on:#fff;--bar:#e9799a;--bar2:#f6cfdb;--barh:#d94f74;--grid:#f1e4e8;--paper:#fffdf9;--tint:#fff5f7;--hl:#fff7e8;--hlb:#f1d38f;--seg:#fff;--off:#cdbfc4;--bg:#f7f1f3;--card:#fff;--ink:#3b2732;--soft:#7d6370;--line:#ecdde2;--accent:#d94f74;--ok:#2f8f63;--okb:#e3f4ea;--warn:#a8691b;--warnb:#fbefd9;--bad:#b6404f;--badb:#f8e0e3;--info:#2f6fc1;--infob:#e4eefb;
  --display:"Fredoka",ui-rounded,system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:1000px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 80px}
header{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
header h1{font:600 20px var(--display);margin:0;flex:1}
header .who{font-size:12.5px;color:var(--soft);text-align:right;line-height:1.3}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.tab,.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font:600 13.5px var(--body);cursor:pointer}
.tab[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on);border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:6px 0 12px}
.kpi{background:var(--card);border-radius:16px;padding:12px 14px}
.kpi small{color:var(--soft);font-size:12px;display:block}.kpi b{font:600 22px var(--display);font-variant-numeric:tabular-nums}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
input[type=search]{flex:1;min-width:180px}
.btn{border:0;border-radius:12px;padding:10px 16px;font:600 14px var(--body);background:var(--accent);color:var(--on);cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.list{display:flex;flex-direction:column;gap:8px}
.ord{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--card);border-radius:16px;padding:12px 14px;cursor:pointer;border:1.5px solid transparent;text-align:left;font:inherit;color:inherit;width:100%}
.ord:hover{border-color:var(--line)}
.ord .c{font-weight:700;font-variant-numeric:tabular-nums}.ord .m{color:var(--soft);font-size:13px}
.ord .r{text-align:right}.ord .t{font:600 16px var(--display);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.p-menunggu_bayaran,.p-pending{background:var(--warnb);color:var(--warn)}.p-baru{background:var(--infob);color:var(--info)}
.p-disiapkan{background:#efe7fb;color:#6a4bb5}.p-siap{background:#fff1d6;color:#9a6512}.p-sampai{background:#dff3ec;color:#1f7a5a}.p-dalam_penghantaran{background:#e3f1f5;color:#21788f}.p-selesai{background:var(--okb);color:var(--ok)}
.p-batal,.p-failed{background:#eee;color:#666}
.empty{background:var(--card);border-radius:16px;padding:28px;text-align:center;color:var(--soft)}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{font:600 16px var(--display);margin:0 0 10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tog{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:9px 12px;font-size:13.5px}
.sw{position:relative;width:44px;height:26px;flex:none}.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--off);border-radius:99px;transition:.2s;cursor:pointer}.sw span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--ok)}.sw input:checked+span:before{transform:translateX(18px)}
.sw input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.rowx{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}.rowx:last-child{border:0}
.rowx span:first-child{color:var(--soft);flex:none}.rowx span:last-child{text-align:right;overflow-wrap:anywhere}
.scrim{position:fixed;inset:0;background:rgba(40,20,30,.4);z-index:20;display:flex;justify-content:flex-end}
.panel{width:min(560px,100%);height:100%;overflow:auto;background:var(--bg);padding:16px max(16px,env(safe-area-inset-right)) 40px 16px;animation:sl .25s ease}
@keyframes sl{from{transform:translateX(40px);opacity:0}}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.tw{position:relative}.tx{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:15px;line-height:1;cursor:pointer}.thumbs a{display:block;width:96px;height:96px;border-radius:10px;overflow:hidden;background:#eee}.thumbs img{width:100%;height:100%;object-fit:cover}
.wishbox{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14.5px}
.msg{padding:10px 12px;border-radius:10px;font-size:13.5px;margin:8px 0}.msg.bad{background:var(--badb);color:var(--bad)}.msg.ok{background:var(--okb);color:var(--ok)}.msg.warn{background:var(--warnb);color:var(--warn)}
.login{max-width:380px;margin:12vh auto 0;background:var(--card);border-radius:20px;padding:24px}
.login h1{font:600 24px var(--display);margin:0 0 4px}.login label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}.login input{width:100%}
.mini{font-size:12.5px;color:var(--soft)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:50;font-size:13.5px}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.kpi.hl{background:var(--hl);border:1.5px solid var(--hlb)}
.dl{display:inline-block;font:700 12px var(--body);border-radius:99px;padding:2px 7px;vertical-align:4px;background:#f1eef0;color:var(--soft)}.dl.up{background:var(--okb);color:var(--ok)}.dl.down{background:var(--badb);color:var(--bad)}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.kpi .mini a{color:inherit}
.seg{display:inline-flex;background:var(--bg);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font:600 13px var(--body);color:var(--soft);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--seg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chartbox{position:relative;height:260px}
.bb:hover rect{filter:brightness(.92)}
.hbar{display:grid;grid-template-columns:22px 1fr auto;gap:2px 10px;align-items:center;margin:8px 0;font-size:14px}
.hbar i{grid-column:2/4;height:7px;border-radius:9px;background:var(--bg);overflow:hidden;display:block}.hbar i b{display:block;height:100%;background:var(--accent);border-radius:9px}
.hbar .n{color:var(--soft);font-size:12.5px}
.ranks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.rt{width:100%;border-collapse:collapse;font-size:13.5px}.rt td{padding:5px 0;border-bottom:1px dashed var(--line)}.rt td+td{text-align:right;font-variant-numeric:tabular-nums;color:var(--soft);white-space:nowrap;padding-left:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{font-size:11.5px;color:var(--soft);text-align:center;font-weight:700;padding:4px 0}
.cal button{min-height:78px;border:1.5px solid transparent;background:var(--card);border-radius:12px;padding:6px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal button.out{visibility:hidden}.cal button.today{border-color:var(--accent)}.cal button[aria-pressed=true]{background:var(--ink);color:var(--card)}
.cal .d{font-weight:700;font-size:13px}.cal .c{font:600 12px var(--body);background:var(--accent);color:var(--on);border-radius:99px;padding:1px 7px;align-self:flex-start}
.cal .c.pend{background:var(--warnb);color:var(--warn)}
@media (max-width:560px){.cal button{min-height:56px;padding:4px}.cal .d{font-size:12px}.cal .lbl{display:none}}

.wf{display:flex;flex-direction:column;gap:6px}
.ck{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--bg);cursor:pointer;font-size:14.5px}
.ck input{width:22px;height:22px;accent-color:var(--ok);flex:none;margin:0}
.ck.on{background:var(--okb)}.ck.on span b{text-decoration:line-through;color:var(--soft);font-weight:500}
.ck small{display:block;color:var(--soft);font-size:11.5px}
.ck.dis{opacity:.6;cursor:default}
.pbar{height:8px;border-radius:9px;background:var(--bg);overflow:hidden;margin:4px 0 10px}.pbar b{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .3s}
.st{position:relative;padding:0 0 14px 34px}.st:last-child{padding-bottom:0}
.st::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}.st:last-child::before{display:none}
.st.done::before{background:var(--ok)}
.st .dt{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:12px;color:#fff}
.st.done .dt{background:var(--ok);border-color:var(--ok)}.st.next .dt{border-color:var(--accent)}
.st b{font-size:14.5px}.st.fut b{color:var(--soft);font-weight:500}
.st small{display:block;color:var(--soft);font-size:12px}
.st .act{margin-top:8px;background:var(--bg);border-radius:12px;padding:10px}
.lock{font-size:13px;color:var(--warn);background:var(--warnb);border-radius:10px;padding:8px 10px}
.ord .pg{display:inline-block;margin-top:3px;font-size:12px;font-weight:600;color:var(--ink);background:var(--bg);border-radius:8px;padding:1px 8px}

.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 12px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--soft)}
.fl input,.fl select,.fl textarea{font-weight:400;color:var(--ink);width:100%}
.fl.full{grid-column:1/-1}
.qbox{position:sticky;bottom:0;background:var(--card);border-radius:16px;padding:14px;box-shadow:0 -6px 20px -12px rgba(0,0,0,.25);margin-top:12px}
.opt2{display:flex;gap:8px;flex-wrap:wrap}.opt2 label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:14px;flex:1;min-width:200px}
.opt2 label:has(input:checked){border-color:var(--accent);background:var(--tint)}
@media print{body *{visibility:hidden}}
.pwrap{position:relative;display:block;min-width:0}.bar>.pwrap{flex:1 1 160px}.pwrap input{width:100%;padding-right:46px!important}.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--soft);cursor:pointer;display:grid;place-items:center;border-radius:10px;padding:0}.eye:hover{color:var(--ink)}.eye:focus-visible{outline:3px solid var(--accent);outline-offset:0}

/* ---------- skins (per browser) ---------- */
.skin{position:relative}.skin>button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:17px;display:grid;place-items:center}
.skinpop{position:absolute;right:0;top:44px;z-index:40;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:8px;width:250px;box-shadow:0 18px 40px -14px rgba(0,0,0,.28)}
.skinpop p{margin:4px 8px 6px;font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.skinpop button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px;border-radius:11px;cursor:pointer;color:var(--ink)}
.skinpop button:hover,.skinpop button[aria-checked=true]{background:var(--bg)}
.skinpop .sws{display:flex;flex:none}.skinpop .sws i{width:16px;height:16px;border-radius:50%;margin-left:-5px;border:2px solid var(--card)}.skinpop .sws i:first-child{margin-left:0}
.skinpop b{display:block;font-size:14.5px;line-height:1.2}.skinpop small{display:block;font-size:11.5px;color:var(--soft)}
.skinpop .ck{margin-left:auto;color:var(--accent);font-weight:700}

/* Semangat Api: bold orange + charcoal, angular display type */
[data-skin=api]{--bg:#f8f1ea;--card:#fffdfa;--ink:#211915;--soft:#6e5a4d;--line:#ead9c8;--accent:#e8611a;--bar:#f0863e;--bar2:#f7d3b4;--grid:#efe0d1;--paper:#fffaf3;--tint:#fff0e4;--hl:#fff2df;--hlb:#f3c68e;--off:#cdb9a8;
  --display:"Russo One",system-ui,sans-serif;--body:"Rubik",system-ui,sans-serif}
[data-skin=api] header h1{text-transform:uppercase;letter-spacing:.04em}
[data-skin=api] .card,[data-skin=api] .kpi{border-radius:10px;border-top:3px solid var(--accent)}
[data-skin=api] .tab,[data-skin=api] .chip,[data-skin=api] .btn{border-radius:8px}
[data-skin=api] .tab[aria-pressed=true]{background:linear-gradient(135deg,#211915 0 80%,#e8611a 80%);border-color:#211915}
[data-skin=api] body{background:var(--bg) radial-gradient(circle at 100% 0,#ffd9bd 0,transparent 340px) no-repeat}

/* Angin Wuxia: rice paper, ink, jade, red seal; classical serif */
[data-skin=angin]{--bg:#efe9dc;--card:#faf6ec;--ink:#1d2523;--soft:#5d6862;--line:#d9cfba;--accent:#2e6b5b;--bar:#3f7f6d;--bar2:#cddbd1;--grid:#e3dac8;--paper:#fffbf0;--tint:#e7efe8;--hl:#f6eccf;--hlb:#d8bf7c;--seg:#fffbf0;--off:#bfb5a1;
  --display:"Cormorant Garamond",Georgia,serif;--body:"Noto Sans",system-ui,sans-serif}
[data-skin=angin] body{background:var(--bg) radial-gradient(ellipse at 50% -10%,rgba(46,107,91,.10),transparent 60%) no-repeat}
[data-skin=angin] header h1{font-weight:700;font-size:25px;letter-spacing:.02em}
[data-skin=angin] .card,[data-skin=angin] .kpi{border-radius:4px;border:1px solid var(--line);box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px rgba(29,37,35,.08)}
[data-skin=angin] .kpi b,[data-skin=angin] h2{font-weight:700}
[data-skin=angin] .kpi b{font-size:26px}
[data-skin=angin] .tab,[data-skin=angin] .chip,[data-skin=angin] .btn,[data-skin=angin] .seg,[data-skin=angin] .seg button{border-radius:3px}
[data-skin=angin] .tab[aria-pressed=true]{background:#1d2523;border-color:#1d2523;box-shadow:inset 0 -3px 0 #b23a2e}
[data-skin=angin] .chip[aria-pressed=true]{background:#b23a2e;border-color:#b23a2e}

/* Chill Tenang: soft sage, round friendly type, airy */
[data-skin=tenang]{--bg:#edf3f0;--card:#fbfdfc;--ink:#2b3a35;--soft:#687a73;--line:#d9e5df;--accent:#4f9580;--bar:#7db4a3;--bar2:#d3e6de;--grid:#e1ebe6;--paper:#f9fcfa;--tint:#e9f4ef;--hl:#f3f6e6;--hlb:#cfdca6;--off:#b9c9c2;
  --display:"Quicksand",ui-rounded,system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif}
[data-skin=tenang] .card,[data-skin=tenang] .kpi{border-radius:24px;box-shadow:0 10px 30px -22px rgba(43,58,53,.45)}
[data-skin=tenang] .tab:not([aria-pressed=true]),[data-skin=tenang] .chip:not([aria-pressed=true]){border-color:transparent;background:rgba(255,255,255,.7)}
[data-skin=tenang] header h1{font-weight:700}
@media (prefers-reduced-motion:no-preference){[data-skin=tenang] body{transition:background .4s}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="layer"></div>
<script>
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rm=n=>{const d=+n%1?2:0;return (+n<0?'−':'')+'RM'+Math.abs(+n).toLocaleString('en-MY',{minimumFractionDigits:d,maximumFractionDigits:d})};
let PM={bq:{},bal:{},cake:{}},GW='gateway bayaran',ME=null,CSRF='',CAT=null,TODAY='',tab='dash',f='today',qs='',dfrom='',dto='';
const ST={menunggu_bayaran:'Menunggu bayaran',baru:'Baru (dibayar)',disiapkan:'Sedang disiapkan',dalam_penghantaran:'Dalam penghantaran',selesai:'Selesai',batal:'Batal'};
const DEL={free:'Percuma 10am–6pm',A:'Slot A 9am–12pm',B:'Slot B 1pm–4pm',C:'Slot C 5pm–8pm',spec:'Masa khusus'};
const OCC_T=()=>CAT.occ,REL_T=()=>CAT.rel;
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
async function api(a,{method='GET',body,params}={}){
  const u='api.php?a='+a+(params?'&'+new URLSearchParams(params):'');
  const o={method,headers:{}};if(method==='POST'){o.headers['X-CSRF']=CSRF;if(body instanceof FormData)o.body=body;else{o.headers['Content-Type']='application/json';o.body=JSON.stringify(body||{})}}
  const r=await fetch(u,o);let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&a!=='login'&&a!=='me'){ME=null;login();throw new Error('auth')}
  if(!r.ok)throw new Error(j.error||'Ralat '+r.status);return j;
}
const fmtD=s=>s?new Date(s+'T00:00').toLocaleDateString('ms-MY',{weekday:'short',day:'numeric',month:'short'}):'-';
const fmtDT=s=>s?new Date(s.replace(' ','T')).toLocaleString('ms-MY',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'-';
const delTxt=o=>DEL[o.del_type]+(o.del_type==='spec'&&o.del_time?' '+o.del_time:'');
const pill=o=>o.pay_status!=='paid'?`<span class="pill p-${o.pay_status==='failed'?'failed':'pending'}">${o.pay_status==='failed'?'Bayaran gagal':'Menunggu bayaran'}</span>`:`<span class="pill p-${o.status}">${ST[o.status]||o.status}</span>`;

/* ---------- login ---------- */
function login(err){
  $('#layer').innerHTML='';
  $('#app').innerHTML=`<form class="login" id="lf"><h1>100 Blooms Admin</h1><p class="mini" style="margin:0">Log masuk untuk Owner dan Staff.</p>
   ${err?`<div class="msg bad">${h(err)}</div>`:''}
   <label for="le">Email</label><input id="le" type="email" autocomplete="username" required>
   <label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required>
   <button class="btn" style="width:100%;margin-top:16px">Log masuk</button></form>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();try{await api('login',{method:'POST',body:{email:$('#le').value,pw:$('#lp').value}});boot()}catch(x){login(x.message)}};
  $('#le').focus();
}
async function boot(){
  try{const j=await api('me');ME=j.user;CSRF=j.csrf;if(j.pmeta)PM=j.pmeta;if(j.status_label)Object.assign(ST,j.status_label);GW=j.gateway||GW;CAT=j.catalog;TODAY=j.today;render()}catch(e){login()}
}
function render(){
  const T=[['dash','Dashboard'],['orders','Order'],['new','＋ Order'],['cal','Kalendar'],['report','Report'],['vouch','Voucher'],['agent','Agent'],['stock','Stok'],['dates','Tutup tarikh'],['acc',ME.role==='owner'?'Pengguna':'Akaun']];
  $('#app').innerHTML=`<header><h1>100 Blooms Admin</h1><div class="skin"><button id="skb" aria-label="Tukar tema" aria-haspopup="true" aria-expanded="false" title="Tukar tema">🎨</button></div><div class="who">${h(ME.name)}<br>${ME.role==='owner'?'Owner':'Staff'} · <a href="#" id="lo">Log keluar</a></div></header>

  el.innerHTML=`<div class="kpis" id="kp"></div>

   <div class="bar"><input type="search" id="qs" placeholder="Cari kod, nama atau telefon" value="${h(qs)}" aria-label="Cari order">
    ${f==='today'?'':`<label class="mini">Tarikh hantar <input type="date" id="df" value="${dfrom}" aria-label="Dari"></label><label class="mini">hingga <input type="date" id="dt" value="${dto}" aria-label="Hingga"></label>`}

  $('#rf').onclick=load;

    const c=j.counts;

       ${o.progress?`<span class="pg">${h(o.progress)}</span>`:''}${(o.need||[]).map(t=>`<span class="pg" style="background:var(--warnb);color:var(--warn)">${h(t)}</span>`).join(' ')}<div class="m">Untuk ${h(o.r_name)} (${h(o.r_post)}) · ${h(CAT.bq[o.bouquet]||o.bouquet)}${o.voucher?' · 🎟️ '+h(o.voucher):''}${o.notes?' · 📝':''}</div></div>
      <div class="r"><div class="t">${rm(o.total)}</div><div class="m">Order ${fmtDT(o.created_at)}</div></div></button>`).join('')
      :`<div class="empty">Tiada order${f==='today'?' untuk dihantar hari ini':''}.</div>`;
    document.querySelectorAll('.ord').forEach(b=>b.onclick=()=>openOrder(+b.dataset.id,load));
  }

      <div class="bar" style="margin:0"><input type="file" id="rpf" accept="image/*" aria-label="Pilih gambar penerima"><button class="btn ${o.recipient_photo?'ghost ':''}sm" id="rpu">${o.recipient_photo?'Tukar gambar':'Upload gambar'}</button></div>
      ${o.recipient_photo?`<button class="btn sm" data-step="delivered" style="margin-top:8px">Tandakan dah sampai</button>`:''}</div>`;
    return `<div class="act"><button class="btn sm" data-step="done">Hantar gambar ke pembeli &amp; selesaikan</button><p class="mini" style="margin:6px 0 0">WhatsApp pembeli akan dibuka dengan link Semak Order (ada gambar penerima).</p></div>`;
  };

      ${k==='booked'&&D.booked?`<div class="bar" style="margin:6px 0 0">${o.lalamove_url?`<a class="mini" href="${h(o.lalamove_url)}" target="_blank" rel="noopener">Buka tracking Lalamove ↗</a>`:''}<input id="lle" type="url" value="${h(o.lalamove_url||'')}" placeholder="Link tracking Lalamove" aria-label="Link tracking Lalamove" style="flex:1;min-width:160px"><button class="btn ghost sm" id="llsave">Simpan link</button></div>`:''}</div>`).join('')}

  const optc=(t,o)=>Object.entries(o).map(([k,n])=>[k,lab(t,k,n)]).sort((a,b)=>{const ca=(PM[t]||{})[a[0]]?.code||'',cb=(PM[t]||{})[b[0]]?.code||'';return (!ca-!cb)||(ca||a[1]).localeCompare(cb||b[1],undefined,{numeric:true})}).map(([k,n])=>`<option value="${h(k)}">${h(n)}</option>`).join('');
  const cakes=[...C.cake_free,...C.cake_up],tom=new Date(Date.now()+864e5);
  el.innerHTML=`<form id="nf" novalidate>
   <div class="card"><h2>Item</h2><div class="fgrid">
    <label class="fl">Bouquet<select id="f_bq">${optc('bq',C.bq)}</select></label>
    <label class="fl">Wrapping / nota bouquet<input id="f_bqn" placeholder="Contoh: Red + Black (Normal)"></label>
    <label class="fl">Balloon<select id="f_bal">${optc('bal',C.bal)}</select></label>
    <label class="fl">Kek<select id="f_cake">${cakes.map(c=>`<option>${h(c)}</option>`).join('')}</select></label>
    <label class="fl" id="w_ofl" hidden>Perisa pilihan (pisah dengan koma, maks 5)<input id="f_ofl" placeholder="Cheese Cake, Tiramisu"></label>
    <label class="fl">Bilangan polaroid<input id="f_pc" type="number" min="1" max="10" value="1"></label>
    <label class="fl">Gambar polaroid (jika dah terima)<input id="f_photos" type="file" accept="image/*" multiple></label>
    <details class="fl full"><summary style="cursor:pointer">Kek tambahan (RM20 sepotong)</summary><div class="bar" style="margin:6px 0 0">${cakes.filter(c=>!/lain/.test(c)).map(c=>`<span class="mini" style="display:flex;align-items:center;gap:4px">${h(c)} <input type="number" min="0" max="10" value="0" data-xc="${h(c)}" style="width:62px" aria-label="Bilangan ${h(c)}"></span>`).join('')}</div></details>
    <label class="fl full">Ayat wishcard (kosongkan jika belum terima)<textarea id="f_wish" rows="3" maxlength="320"></textarea></label>
    <label class="fl">Daripada<input id="f_sender"></label></div></div>
   <div class="card"><h2>Pembeli</h2><div class="fgrid">
    <label class="fl">Nama pembeli<input id="f_bname"></label>
    <label class="fl">No. WhatsApp pembeli<input id="f_bphone" type="tel" inputmode="tel" placeholder="01X-XXX XXXX"></label></div></div>
   <div class="card"><h2>Penerima & penghantaran</h2><div class="fgrid">
    <label class="fl">Nama penerima<input id="f_rname"></label>
    <label class="fl">Telefon penerima<input id="f_rphone" type="tel" inputmode="tel"></label>
    <label class="fl full">Alamat penuh<textarea id="f_raddr" rows="3"></textarea></label>
    <label class="fl">Poskod<input id="f_rpost" inputmode="numeric" maxlength="5"></label>
    <label class="fl">Tarikh hantar<input id="f_date" type="date" value="${ymd(tom)}"></label>
    <label class="fl">Slot<select id="f_del">${Object.entries(DEL).map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select></label>
    <label class="fl" id="w_time" hidden>Masa khusus<input id="f_time" type="time" min="09:00" max="22:00"></label></div></div>
   <div class="card"><h2>Harga & bayaran</h2>
    <details><summary class="mini" style="cursor:pointer">Voucher, pelarasan harga, kes khas</summary><div class="fgrid" style="margin-top:8px">
     <label class="fl">Kod voucher<input id="f_voucher"></label>
     <label class="fl">No. agent (contoh 101)<input id="f_ref" inputmode="numeric"></label>
     <label class="fl">Pelarasan harga RM (+/−)<input id="f_adj" type="number" step="1" placeholder="Contoh: -10 atau 15"></label>
     <label class="fl">Sebab pelarasan<input id="f_adjl" placeholder="Contoh: caj luar kawasan Kajang"></label>
     <label class="fl full" style="flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:500"><input type="checkbox" id="f_ov" style="width:auto"> Abaikan had waktu tutup, tarikh ditutup, stok dan kawasan</label>
     <label class="fl full">Nota dalaman<input id="f_notes"></label></div></details>

  const V=id=>$('#'+id).value,photos=()=>$('#f_photos').files.length;
  const data=()=>{const xc={};el.querySelectorAll('[data-xc]').forEach(i=>{if(+i.value>0)xc[i.dataset.xc]=+i.value});
    return{bq:V('f_bq'),bq_note:V('f_bqn'),bal:V('f_bal'),cake:V('f_cake'),otherFl:V('f_ofl').split(',').map(x=>x.trim()).filter(Boolean).slice(0,5),photo_count:+V('f_pc')||1,
      extraCakes:xc,wish:V('f_wish'),sender:V('f_sender'),rname:V('f_rname'),rphone:V('f_rphone'),raddr:V('f_raddr'),rpost:V('f_rpost').replace(/\D/g,''),date:V('f_date'),del:V('f_del'),time:V('f_time'),
      bname:V('f_bname'),bphone:V('f_bphone'),ref:V('f_ref').trim(),voucher:V('f_voucher').trim(),adj_amt:V('f_adj'),adj_label:V('f_adjl'),override:$('#f_ov').checked,notes:V('f_notes'),
      pay_mode:el.querySelector('[name=pm]:checked').value,pay_ref:V('f_pref')}};
  let tm,ok=false;
  const quote=async()=>{const d=data();$('#w_ofl').hidden=!/lain/.test(d.cake);$('#w_time').hidden=d.del!=='spec';$('#w_pref').hidden=d.pay_mode!=='paid';
    try{const j=await api('quote',{method:'POST',body:{data:d,photos:photos()}});
      if(j.errors){ok=false;$('#qv').innerHTML=`<div class="msg warn" style="margin:0">${j.errors.map(h).join('<br>')}</div>`}
      else{ok=true;$('#qv').innerHTML=j.lines.map(([l,p])=>`<div class="rowx"><span>${h(l)}</span><span>${p?rm(p):'Percuma'}</span></div>`).join('')+`<div class="rowx" style="font-weight:700"><span style="color:var(--ink)">Jumlah</span><span>${rm(j.total)}</span></div>${j.zone==='out'?'<div class="msg warn" style="margin:6px 0 0">Poskod di luar kawasan. Tambah caj melalui pelarasan harga jika perlu.</div>':''}`}
      $('#go').disabled=!ok;$('#go').textContent={paid:'Cipta order (dah bayar)',link:'Cipta order & link bayaran',invoice:'Cipta order & invoice'}[d.pay_mode];}catch(e){}};
  el.querySelectorAll('input,select,textarea').forEach(i=>i.addEventListener(i.type==='file'||i.tagName==='SELECT'||i.type==='radio'||i.type==='checkbox'?'change':'input',()=>{clearTimeout(tm);tm=setTimeout(quote,350)}));
  quote();
  $('#nf').onsubmit=async e=>{e.preventDefault();if(!ok)return;const d=data(),fd=new FormData();fd.append('data',JSON.stringify(d));[...$('#f_photos').files].forEach(f=>fd.append('photo[]',f));
    $('#go').disabled=true;$('#go').textContent='Menyimpan…';
    let j;try{j=await api('manual',{method:'POST',body:fd})}catch(x){toast(x.message);$('#go').disabled=false;quote();return}
    showInvoice(el,j,d.bphone,()=>NewOrder(el));};
}
function waLink(phone,text){return 'https://wa.me/'+String(phone).replace(/\D/g,'').replace(/^0/,'60')+'?text='+encodeURIComponent(text)}
function showInvoice(el,j,phone,again){
  el.innerHTML=`<div class="card"><h2>✅ Order ${h(j.code)} dicipta</h2><p style="margin:0 0 6px">Jumlah <b>${rm(j.total)}</b> · ${j.paid?'ditanda <b>dah bayar</b>':j.mode==='invoice'?'menunggu pembeli bayar melalui QR bank':'menunggu bayaran online'}</p>
    ${j.warn?`<div class="msg bad">${h(j.warn)}</div>`:''}
    <div class="wishbox" id="inv" style="font-size:13px;max-height:340px;overflow:auto">${h(j.invoice)}</div>
    <div class="bar"><a class="btn" style="text-decoration:none" href="${waLink(phone,j.invoice)}" target="_blank" rel="noopener">WhatsApp invoice kepada pembeli</a><button class="btn ghost" id="cpi">Salin invoice</button></div>
    ${j.mode==='invoice'?`<div class="msg warn">Langkah seterusnya: hantar QR bank kepada pembeli.${j.has_qr?` <a href="../api/bankqr.php" target="_blank" rel="noopener">Buka gambar QR</a> (tekan lama untuk simpan / kongsi).`:' Owner boleh upload gambar QR di tab Pengguna supaya ia juga muncul di link invoice.'} Bila pembeli hantar resit, buka order ni dan tekan <b>Sahkan bayaran</b>.</div>`:''}
    <div class="bar"><button class="btn ghost" id="oo">Buka order</button>${again?'<button class="btn ghost" id="nn2">Order baru</button>':''}</div></div>`;
  $('#cpi').onclick=()=>navigator.clipboard.writeText(j.invoice).then(()=>toast('Invoice disalin'),()=>toast('Tak dapat salin'));
  $('#oo').onclick=()=>openOrder(j.id);if(again)$('#nn2').onclick=again;
}

/* ---------- shared: charts (plain SVG, no external library) ---------- */
function niceMax(v){if(v<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function barChart(id,labels,data,prev,prevLabels){
  const box=document.getElementById(id);if(!box)return;
  const W=Math.max(320,box.clientWidth||600),H=box.clientHeight||260,L=52,R=8,T=10,B=26,cw=W-L-R,ch=H-T-B,n=data.length||1,mx=niceMax(Math.max(0,...data,...(prev||[])));
  const slot=cw/n,bw=Math.min(38,slot*.68),every=Math.ceil(n/Math.max(1,Math.floor(cw/58)));
  const fmt=v=>'RM'+(v>=1000?(Math.round(v/100)/10)+'k':Math.round(v));
  let g='';for(let i=0;i<=4;i++){const v=mx*i/4,y=T+ch-ch*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="${cv('--grid')}"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="${cv('--soft')}">${fmt(v)}</text>`}
  const bars=data.map((v,i)=>{const h=v/mx*ch,x=L+slot*i+(slot-bw)/2,y=T+ch-h,p=prev?prev[i]||0:null;
    const ph=p!==null?p/mx*ch:0,pw=bw*.55,tip=`${labels[i]}: ${rm(v)}${p!==null?` · sebelum (${prevLabels?prevLabels[i]:''}): ${rm(p)}`:''}`;
    return `<g class="bb"><title>${tip}</title>${p!==null&&p>0?`<rect x="${x-bw*.18}" y="${T+ch-ph}" width="${pw}" height="${Math.max(ph,2)}" rx="4" fill="${cv('--bar2')}"/>`:''}
      <rect x="${x+(p!==null?bw*.18:0)}" y="${y}" width="${p!==null?bw*.82:bw}" height="${Math.max(h,v>0?2:0)}" rx="5" fill="${cv('--bar')}"/>
      <rect x="${L+slot*i}" y="${T}" width="${slot}" height="${ch}" fill="transparent"/>${i%every===0?`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="${cv('--soft')}">${labels[i]}</text>`:''}</g>`}).join('');
  box.innerHTML=`<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graf: ${labels.length} titik data">${g}${bars}</svg>`;
}
const dShort=s=>new Date(s+'T00:00').toLocaleDateString('ms-MY',{day:'numeric',month:'short'});
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

/* ---------- dashboard ---------- */
let dashMode='day',dashBy=(()=>{try{return localStorage.getItem('hb_dash_by')||'paid'}catch(e){return 'paid'}})();
const delta=(cur,prev)=>{cur=+cur;prev=+prev;if(!prev&&!cur)return '<span class="dl">—</span>';if(!prev)return '<span class="dl up">↑ baru</span>';
  const p=(cur-prev)/prev*100,r=Math.abs(p)<10?Math.abs(p).toFixed(1):Math.round(Math.abs(p));return `<span class="dl ${p>=0?'up':'down'}">${p>=0?'↑':'↓'} ${r}%</span>`};
async function Dash(el){
  el.innerHTML='<div class="empty">Memuatkan…</div>';
  let j;try{j=await api('dash',{params:{by:dashBy}})}catch(e){if(e.message!=='auth')el.innerHTML=`<div class="msg bad">${h(e.message)}</div>`;return}
  const hr=new Date().getHours(),greet=hr<12?'Selamat pagi':hr<15?'Selamat tengah hari':hr<19?'Selamat petang':'Selamat malam';
  const td=j.today_del,tdN=Object.values(td).reduce((a,b)=>a+ +b,0),mx=Math.max(1,...j.top_bq.map(b=>+b.n)),K=j.kpi;
  const [lmA,lmB]=j.cut.lm.split('|'),lmTxt=`${dShort(lmA)}–${dShort(lmB)}`;
  const card=(t,c,sub,prevTxt)=>`<div class="kpi"><small>${t}</small><b>${rm(c.s)}</b> ${delta(c.s,c.prev.s)}<div class="mini">${c.n} order · ${sub}</div><div class="mini">vs ${rm(c.prev.s)} ${prevTxt}</div></div>`;
  el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:6px 0 12px"><div><h2 style="font:600 22px var(--display);margin:0 0 2px">${greet}, ${h(ME.name.split(' ')[0])}</h2>
     <p class="mini" style="margin:0">${new Date().toLocaleDateString('ms-MY',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p></div>
    <div><span class="mini" style="margin-right:6px">Kira ikut</span><div class="seg" role="group" aria-label="Kira sales ikut">${[['paid','Tarikh bayar'],['created','Tarikh order']].map(([k,t])=>`<button data-by="${k}" aria-pressed="${dashBy===k}">${t}</button>`).join('')}</div></div></div>
   <div class="grid4">
    ${card('Sales hari ni',K.today,`sehingga ${j.cut.now}`,`semalam (sehingga ${j.cut.now})`)}
    ${card('Sales 7 hari',K.week,'7 hari terakhir','7 hari sebelumnya')}
    ${card('Sales bulan ni',K.month,'bulan ni setakat hari ni',`bulan lepas (${lmTxt})`)}
    <div class="kpi"><small>Order masuk hari ni</small><b>${K.created.n}</b> ${delta(K.created.n,K.created.prev.n)}<div class="mini">termasuk yang belum bayar</div><div class="mini">vs ${K.created.prev.n} semalam (sehingga ${j.cut.now})</div></div>
    <div class="kpi ${+j.pending.n?'hl':''}"><small>Menunggu bayaran (7 hari)</small><b>${j.pending.n}</b><div class="mini">${rm(j.pending.s)} belum dibayar · <a href="#" id="fu">Follow up</a></div></div>
   </div>
   <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px"><h2 style="margin:0">Jumlah sales</h2>
     <div class="seg" role="group" aria-label="Tempoh graf">${[['day','Harian'],['week','Mingguan'],['month','Bulanan']].map(([k,t])=>`<button data-m="${k}" aria-pressed="${dashMode===k}">${t}</button>`).join('')}</div></div>
    <div id="chsum" class="mini" style="margin:0 0 8px"></div>
    <div class="chartbox"><div id="ch1" style="height:260px"></div></div>
    <p class="mini" style="margin:8px 0 0"><span class="lg" style="background:var(--bar)"></span>Tempoh ini &nbsp; <span class="lg" style="background:var(--bar2)"></span><span id="chprev"></span>
     · Order dibayar sahaja, ikut <b>${dashBy==='created'?'tarikh order dibuat':'tarikh bayaran'}</b>. Order batal tak dikira.</p></div>
   <div class="ranks">
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Hantar hari ni</h2><span class="pill p-baru">${tdN} order</span></div>
     ${[['baru','Baru (belum mula)'],['disiapkan','Sedang disiapkan'],['siap','Siap dihantar'],['dalam_penghantaran','Dalam penghantaran'],['sampai','Dah sampai'],['selesai','Selesai']].map(([k,t])=>`<div class="rowx"><span>${t}</span><span><b>${td[k]||0}</b></span></div>`).join('')}
     <button class="btn ghost sm" id="goToday" style="margin-top:10px">Buka order hari ni</button></div>
    <div class="card"><h2>Bouquet laris bulan ni</h2>${j.top_bq.length?j.top_bq.map((b,i)=>`<div class="hbar"><span class="n">${i+1}</span><span>${h(b.name)}</span><b>${b.n}</b><i><b style="width:${b.n/mx*100}%"></b></i></div>`).join(''):'<p class="mini">Belum ada order dibayar bulan ni.</p>'}</div>
   </div>`;
  const draw=()=>{const S=j.series[dashMode],k=S.keys;
    const lab=dashMode==='day'?k.map(dShort):dashMode==='week'?k.map(w=>'Mg '+w.split('W')[1]):k.map(m=>new Date(m+'-01T00:00').toLocaleDateString('ms-MY',{month:'short',year:'2-digit'}));
    const pl={day:'14 hari sebelumnya',week:'12 minggu sebelumnya',month:'bulan sama tahun lepas'}[dashMode];
    const pLab=dashMode==='day'?k.map(d=>dShort(ymd(new Date(new Date(d+'T00:00').getTime()-14*864e5)))):dashMode==='week'?k.map(()=>'12 mg lepas'):k.map(m=>new Date((+m.slice(0,4)-1)+m.slice(4)+'-01T00:00').toLocaleDateString('ms-MY',{month:'short',year:'2-digit'}));
    const a=S.cur.reduce((x,y)=>x+y,0),b=S.prev.reduce((x,y)=>x+y,0);
    $('#chsum').innerHTML=`Jumlah tempoh ini <b style="color:var(--ink)">${rm(a)}</b> ${delta(a,b)} · ${pl}: ${rm(b)}`;$('#chprev').textContent=pl.charAt(0).toUpperCase()+pl.slice(1);
    barChart('ch1',lab,S.cur,S.prev,pLab);};
  draw();
  el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{dashMode=b.dataset.m;el.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
  el.querySelectorAll('[data-by]').forEach(b=>b.onclick=()=>{dashBy=b.dataset.by;try{localStorage.setItem('hb_dash_by',dashBy)}catch(e){}Dash(el)});

/* ---------- report ---------- */
let rp={preset:'month',from:'',to:'',by:'paid'};
function presetRange(p){const n=new Date(),d=x=>ymd(x);
  if(p==='7')return[d(new Date(n.getTime()-6*864e5)),d(n)];if(p==='30')return[d(new Date(n.getTime()-29*864e5)),d(n)];if(p==='90')return[d(new Date(n.getTime()-89*864e5)),d(n)];
  if(p==='last'){const a=new Date(n.getFullYear(),n.getMonth()-1,1),b=new Date(n.getFullYear(),n.getMonth(),0);return[d(a),d(b)]}
  return[d(new Date(n.getFullYear(),n.getMonth(),1)),d(n)];}
async function Report(el){
  if(rp.preset!=='custom')[rp.from,rp.to]=presetRange(rp.preset);

    <div class="bar" style="margin:10px 0 0"><label class="mini">Dari <input type="date" id="rf" value="${rp.from}"></label><label class="mini">Hingga <input type="date" id="rt" value="${rp.to}"></label>
     <div class="seg" role="group" aria-label="Ikut tarikh"><button data-b="paid" aria-pressed="${rp.by==='paid'}">Tarikh bayar</button><button data-b="del" aria-pressed="${rp.by==='del'}">Tarikh hantar</button></div>
     <a class="btn ghost sm" id="csv" style="text-decoration:none" href="api.php?a=reportcsv&from=${rp.from}&to=${rp.to}&by=${rp.by}">Muat turun CSV</a></div></div>
   <div id="rbody"><div class="empty">Memuatkan…</div></div>`;
  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{rp.preset=b.dataset.p;Report(el)});
  el.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{rp.by=b.dataset.b;Report(el)});
  const cust=()=>{rp.preset='custom';rp.from=$('#rf').value;rp.to=$('#rt').value;if(rp.from&&rp.to)Report(el)};$('#rf').onchange=cust;$('#rt').onchange=cust;
  let j;try{j=await api('report',{params:{from:rp.from,to:rp.to,by:rp.by}})}catch(e){$('#rbody').innerHTML=`<div class="msg bad">${h(e.message)}</div>`;return}
  const R=j.rank,tbl=(t,a)=>`<div class="card"><h2>${t}</h2>${a.length?`<table class="rt">${a.slice(0,8).map(r=>`<tr><td>${h(r.name)}</td><td>${r.n} · ${rm(r.sales)}</td></tr>`).join('')}</table>`:'<p class="mini">Tiada data.</p>'}</div>`;

    <div class="kpi"><small>Jumlah jualan</small><b>${rm(j.sales)}</b></div>
    <div class="kpi"><small>Order dibayar</small><b>${j.paid}</b></div>
    <div class="kpi"><small>Purata setiap order</small><b>${rm(j.avg)}</b></div>
    <div class="kpi"><small>Kadar bayar</small><b>${j.pay_rate}%</b><div class="mini">${j.created} order masuk dalam tempoh ni</div></div>

const shrink=(f,max=1200)=>new Promise(res=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);

  $('#ba').onclick=async()=>{if(!$('#bd').value)return toast('Pilih tarikh');try{await api('block',{method:'POST',body:{d:$('#bd').value,reason:$('#br').value}});Dates(el)}catch(e){toast(e.message)}};
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{await api('unblock',{method:'POST',body:{d:b.dataset.d}});Dates(el)});
}
/* ---------- accounts ---------- */
async function Acc(el){
  let users='';
  if(ME.role==='owner'){const j=await api('users');users=`<div class="card"><h2>Pengguna admin</h2>${j.rows.map(u=>`<div class="rowx"><span><b style="color:var(--ink)">${h(u.name)}</b> ${h(u.email)} · ${u.role==='owner'?'Owner':'Staff'}</span><span>${u.id!=ME.id?`<button class="btn ghost sm" data-del="${u.id}">Padam</button>`:'Anda'}</span></div>`).join('')}
    <h2 style="margin-top:16px">Tambah pengguna</h2><div class="bar"><input id="un" placeholder="Nama" aria-label="Nama"><input id="ue" type="email" placeholder="Email" aria-label="Email"><input id="up" type="password" placeholder="Password (min 8)" aria-label="Password">
    <select id="ur" aria-label="Peranan"><option value="staff">Staff</option><option value="owner">Owner</option></select><button class="btn sm" id="ua">Tambah</button></div>
    <p class="mini" style="margin:0">Staff boleh urus order, stok dan tarikh. Semua staff boleh sahkan bayaran (wajib isi rujukan). Hanya Owner boleh urus pengguna, kod/harga produk dan QR bank.</p></div>`;}
  if(ME.role==='owner'){const ps=await api('payset');users+=`<div class="card"><h2>Bayaran QR bank</h2><p class="mini" style="margin-top:0">QR dan maklumat akaun ini dipaparkan pada halaman semak order untuk pembeli yang bayar ikut invoice.</p>
    <img id="qrp" alt="QR bank" style="max-width:180px;border-radius:12px;border:1px solid var(--line);display:${ps.has_qr?'block':'none'};margin-bottom:10px" src="${ps.has_qr?'../api/bankqr.php?t='+Date.now():''}">
    <div class="bar"><input type="file" id="qrf" accept="image/jpeg,image/png" aria-label="Gambar QR"><button class="btn ghost sm" id="qru">Muat naik QR</button></div>
    <textarea id="bkt" rows="3" maxlength="300" placeholder="Contoh: Maybank 5123 4567 8901 (100 Blooms Enterprise)" aria-label="Maklumat akaun bank" style="width:100%">${h(ps.bank_text||'')}</textarea>
    <button class="btn sm" id="bks" style="margin-top:8px">Simpan maklumat akaun</button></div>`;}
  if(ME.role==='owner'){const w=await api('waset');users+=`<div class="card" id="wac"><h2>Notifikasi WhatsApp (Murpati)</h2>
    <p class="mini" style="margin-top:0">Mesej automatik kepada team, pembeli dan agent. API key dari Murpati → Settings (pelan Pro ke atas).</p>
    <label class="fl">API key ${w.has_key?`<span class="mini">· disimpan (${h(w.key_hint)})</span>`:''}<input id="wak" type="password" autocomplete="off" placeholder="${w.has_key?'Biarkan kosong untuk kekalkan':'sk_...'}"></label>
    <div class="bar" style="margin:8px 0"><button class="btn ghost sm" id="was">Simpan key &amp; cari nombor</button>${w.has_key?'<button class="btn ghost sm" id="wax">Buang key</button>':''}</div>
    <label class="fl">Nombor yang menghantar<select id="wan"><option value="${h(w.session)}">${w.session?h(w.session):'Simpan key dulu, kemudian pilih nombor'}</option></select></label>
    <label class="fl" style="margin-top:8px">Nombor team yang terima notifikasi order (pisah dengan koma)<input id="wat" value="${h(w.team)}" placeholder="601165862584, 60143467099"></label>
    <div style="margin:10px 0 4px"><b class="mini" style="color:var(--ink)">Hantar mesej bila:</b></div>
    ${Object.entries(w.types).map(([k,t])=>`<label style="display:flex;gap:8px;align-items:center;font-size:14px;margin:4px 0"><input type="checkbox" data-wa="${k}" ${w.on[k]?'checked':''} style="width:auto"> ${h(t)}</label>`).join('')}
    <button class="btn sm" id="wasv" style="margin-top:10px">Simpan tetapan</button>
    <div class="bar" style="margin:14px 0 0"><input id="wtn" placeholder="No. untuk ujian, cth 0123456789" aria-label="Nombor ujian"><button class="btn ghost sm" id="wts">Hantar mesej ujian</button></div>
    <p class="mini" id="wal" style="margin:8px 0 0">${w.last?`Mesej terakhir ${fmtDT(w.last.at)} ke ${h(w.last.to)}: ${w.last.ok?'<b style="color:var(--ok)">berjaya</b>':`<b style="color:var(--bad)">gagal</b> (${h(w.last.error||'')})`}`:'Belum ada mesej dihantar.'}</p></div>`;}
  if(ME.role==='owner')users+=`<div class="card"><h2>Notifikasi email</h2><p class="mini" style="margin-top:0">Hantar email ujian ke alamat NOTIFY_EMAIL dalam config.php.</p><button class="btn ghost sm" id="tm">Hantar email ujian</button> <span class="mini" id="tmr"></span></div>`;
  el.innerHTML=users+`<div class="card"><h2>Tukar password saya</h2><div class="bar"><input id="po" type="password" placeholder="Password lama" aria-label="Password lama" autocomplete="current-password"><input id="pn" type="password" placeholder="Password baru (min 8)" aria-label="Password baru" autocomplete="new-password"><button class="btn sm" id="pc">Tukar</button></div></div>`;
  if($('#ua'))$('#ua').onclick=async()=>{try{await api('adduser',{method:'POST',body:{name:$('#un').value,email:$('#ue').value,pw:$('#up').value,role:$('#ur').value}});toast('Pengguna ditambah');Acc(el)}catch(e){toast(e.message)}};
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Padam pengguna ini?')){await api('deluser',{method:'POST',body:{id:+b.dataset.del}});Acc(el)}});
  if($('#tm'))$('#tm').onclick=async()=>{$('#tmr').textContent='Menghantar…';try{const j=await api('testmail',{method:'POST'});$('#tmr').textContent=j.ok?`Server dah hantar ke ${j.to} (dari ${j.from}). Semak inbox dan spam.`:'Server gagal hantar email (fungsi mail() ditolak hosting).'}catch(e){$('#tmr').textContent=e.message}};
  if($('#qru'))$('#qru').onclick=async()=>{const f=$('#qrf').files[0];if(!f)return toast('Pilih gambar QR dulu');const fd=new FormData();fd.append('file',f);try{await api('qrup',{method:'POST',body:fd});const im=$('#qrp');im.src='../api/bankqr.php?t='+Date.now();im.style.display='block';toast('QR disimpan')}catch(e){toast(e.message)}};
  if($('#bks'))$('#bks').onclick=async()=>{try{await api('payset',{method:'POST',body:{bank_text:$('#bkt').value}});toast('Maklumat akaun disimpan')}catch(e){toast(e.message)}};
  if($('#wac')){
    const sess=async()=>{try{const r=await api('wasess');const cur=$('#wan').value;$('#wan').innerHTML=r.rows.length?r.rows.map(x=>`<option value="${h(x.id)}" ${x.id===cur?'selected':''}>${h(x.phone||x.id)}${x.name?' · '+h(x.name):''} · ${x.pipeline==='official'?'API rasmi':'peranti biasa'}${x.status?' · '+h(x.status):''}</option>`).join(''):'<option value="">Tiada nombor disambung dalam Murpati</option>'}catch(e){toast(e.message)}};
    $('#was').onclick=async()=>{const k=$('#wak').value.trim();try{if(k)await api('waset',{method:'POST',body:{key:k}});$('#wak').value='';await sess();toast('Pilih nombor, kemudian Simpan tetapan')}catch(e){toast(e.message)}};
    if($('#wax'))$('#wax').onclick=async()=>{if(!confirm('Buang API key? Notifikasi WhatsApp akan berhenti.'))return;await api('waset',{method:'POST',body:{clear_key:1}});Acc(el)};
    $('#wasv').onclick=async()=>{const on={};el.querySelectorAll('[data-wa]').forEach(c=>on[c.dataset.wa]=c.checked);
      try{await api('waset',{method:'POST',body:{session:$('#wan').value,team:$('#wat').value,on}});toast('Tetapan WhatsApp disimpan')}catch(e){toast(e.message)}};
    $('#wts').onclick=async()=>{$('#wts').disabled=true;try{await api('watest',{method:'POST',body:{to:$('#wtn').value}});toast('Mesej ujian dihantar. Semak WhatsApp.')}catch(e){toast(e.message)}$('#wts').disabled=false;
      const w=await api('waset');if(w.last)$('#wal').innerHTML=`Mesej terakhir ${fmtDT(w.last.at)} ke ${h(w.last.to)}: ${w.last.ok?'<b style="color:var(--ok)">berjaya</b>':`<b style="color:var(--bad)">gagal</b> (${h(w.last.error||'')})`}`};
    if(/^sess_|^official:/.test($('#wan').value))sess();
  }
  $('#pc').onclick=async()=>{try{await api('passwd',{method:'POST',body:{old:$('#po').value,new:$('#pn').value}});toast('Password ditukar');$('#po').value=$('#pn').value=''}catch(e){toast(e.message)}};
}
/* show / hide password: adds an eye button to every password field, including ones rendered later */
(()=>{const EYE='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  OFF='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.9 3.8M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></svg>';
  const deco=root=>root.querySelectorAll('input[type=password]:not([data-eye])').forEach(i=>{i.dataset.eye=1;
    const w=document.createElement('span');w.className='pwrap';i.parentNode.insertBefore(w,i);w.appendChild(i);
    const b=document.createElement('button');b.type='button';b.className='eye';b.innerHTML=EYE;b.setAttribute('aria-label','Tunjuk password');b.setAttribute('aria-pressed','false');
    b.onclick=()=>{const show=i.type==='password';i.type=show?'text':'password';b.innerHTML=show?OFF:EYE;b.setAttribute('aria-label',show?'Sorok password':'Tunjuk password');b.setAttribute('aria-pressed',String(show));i.focus()};
    w.appendChild(b)});
  new MutationObserver(()=>deco(document)).observe(document.body,{childList:true,subtree:true});deco(document);})();
/* ---------- skins ---------- */
const SKINS=[['bunga','Bunga','Default 100 Blooms',['#d94f74','#f7f1f3','#3b2732']],['api','Semangat Api','Oren bertenaga, gaya ninja',['#e8611a','#211915','#f8f1ea']],
  ['angin','Angin Wuxia','Kertas beras, dakwat & jed',['#2e6b5b','#1d2523','#b23a2e']],['tenang','Chill Tenang','Sage lembut, tenang di mata',['#4f9580','#edf3f0','#2b3a35']]];
const SKIN_FONTS={api:'family=Russo+One&family=Rubik:wght@400;500;600;700',angin:'family=Cormorant+Garamond:wght@600;700&family=Noto+Sans:wght@400;500;600;700',tenang:'family=Quicksand:wght@500;600;700&family=Nunito:wght@400;500;600;700'};
function skinFonts(k){if(!SKIN_FONTS[k]||document.getElementById('sf-'+k))return;const l=document.createElement('link');l.id='sf-'+k;l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?'+SKIN_FONTS[k]+'&display=swap';document.head.appendChild(l)}
function curSkin(){return document.documentElement.dataset.skin||'bunga'}
function setSkin(k){if(k==='bunga')delete document.documentElement.dataset.skin;else{skinFonts(k);document.documentElement.dataset.skin=k}try{localStorage.setItem('hb_skin',k)}catch(e){}if(ME)render()}
function skinMenu(){const box=$('.skin');let pop=box.querySelector('.skinpop');if(pop){pop.remove();$('#skb').setAttribute('aria-expanded','false');return}
  pop=document.createElement('div');pop.className='skinpop';pop.setAttribute('role','menu');
  pop.innerHTML='<p>Tema admin</p>'+SKINS.map(([k,n,d,c])=>`<button role="menuitemradio" aria-checked="${curSkin()===k}" data-sk="${k}"><span class="sws">${c.map(x=>`<i style="background:${x}"></i>`).join('')}</span><span><b>${n}</b><small>${d}</small></span>${curSkin()===k?'<span class="ck">✓</span>':''}</button>`).join('')+'<p style="text-transform:none;letter-spacing:0;font-weight:500;margin-top:8px">Disimpan dalam browser ni sahaja.</p>';
  box.appendChild(pop);$('#skb').setAttribute('aria-expanded','true');
  pop.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>setSkin(b.dataset.sk));
  setTimeout(()=>document.addEventListener('click',function off(ev){if(!pop.contains(ev.target)){pop.remove();document.removeEventListener('click',off);const sb=$('#skb');if(sb)sb.setAttribute('aria-expanded','false')}}),0);
}
skinFonts(curSkin());
boot();
</script>
