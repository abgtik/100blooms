.skin{position:relative}.skin>button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:17px;display:grid;place-items:center}
.skinpop{position:absolute;right:0;top:44px;z-index:40;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:8px;width:250px;box-shadow:0 18px 40px -14px rgba(0,0,0,.28)}
.skinpop p{margin:4px 8px 6px;font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.skinpop button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px;border-radius:11px;cursor:pointer;color:var(--ink)}
.skinpop button:hover,.skinpop button[aria-checked=true]{background:var(--bg)}
.skinpop .sws{display:flex;flex:none}.skinpop .sws i{width:16px;height:16px;border-radius:50%;margin-left:-5px;border:2px solid var(--card)}.skinpop .sws i:first-child{margin-left:0}
.skinpop b{display:block;font-size:14.5px;line-height:1.2}.skinpop small{display:block;font-size:11.5px;color:var(--soft)}
.skinpop .ck{margin-left:auto;color:var(--accent);font-weight:700}

/* Semangat Api: bold orange + charcoal, angular display type */
[data-skin=api]{--bg:#f8f1ea;--card:#fffdfa;--ink:#211915;--soft:#6e5a4d;--line:#ead9c8;--accent:#e8611a;--bar:#f0863e;--bar2:#f7d3b4;--grid:#efe0d1;--paper:#fffaf3;--tint:#fff0e4;--hl:#fff2df;--hlb:#f3c68e;--off:#cdb9a8;

/* ---------- login ---------- */
function login(err){
  $('#layer').innerHTML='';
  $('#app').innerHTML=`<form class="login" id="lf"><h1>100 Blooms Admin</h1><p class="mini" style="margin:0">Log masuk untuk Owner dan Staff.</p>
   ${err?`<div class="msg bad">${h(err)}</div>`:''}
   <label for="le">Email</label><input id="le" type="email" autocomplete="username" required>
   <label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required>
   <button class="btn" style="width:100%;margin-top:16px">Log masuk</button></form>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();try{await api('login',{method:'POST',body:{email:$('#le').value,pw:$('#lp').value}});boot()}catch(x){login(x.message)}};
  $('#le').focus();
}
async function boot(){
  try{const j=await api('me');ME=j.user;ME.site=j.site;ADDONS=j.addons||{};CSRF=j.csrf;if(j.pmeta)PM=j.pmeta;if(j.status_label)Object.assign(ST,j.status_label);GW=j.gateway||GW;CAT=j.catalog;TODAY=j.today;render()}catch(e){login()}
}
function render(){
  const T=[['dash','Dashboard'],['orders','Order'],['new','＋ Order'],['cal','Kalendar'],['report','Report'],['vouch','Voucher'],['agent','Agent'],['cust','Pelanggan'],['stock','Stok'],['dates','Tutup tarikh'],['acc',ME.role==='owner'?'Pengguna':'Akaun']];
  $('#app').innerHTML=`<header><h1>100 Blooms Admin</h1><div class="solatw" id="solw"></div><div class="hr"><div class="skin"><button id="skb" aria-label="Tukar tema" aria-haspopup="true" aria-expanded="false" title="Tukar tema">🎨</button></div><div class="who">${h(ME.name)}<br>${ME.role==='owner'?'Owner':'Staff'} · <a href="#" id="lo">Log keluar</a></div></div></header>
   <nav class="tabs" aria-label="Menu">${T.map(([k,t])=>`<button class="tab" data-t="${k}" aria-pressed="${tab===k}">${t}</button>`).join('')}</nav><main id="main"></main>`;
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  $('#skb').onclick=e=>{e.stopPropagation();skinMenu()};
  solatInit();

  ({dash:Dash,new:NewOrder,cal:Cal,report:Report,orders:Orders,vouch:Vouchers,agent:Agents,cust:Customers,stock:Stock,dates:Dates,acc:Acc})[tab]($('#main'));
}

    box.innerHTML=`<div class="card" style="margin:6px 0 10px;background:var(--bg)"><div class="rowx"><span>Pembeli</span><span>${h(o.name||'-')}${o.phone?` · <a href="https://wa.me/${h(o.phone)}" target="_blank" rel="noopener">${h(o.phone)}</a>`:''}</span></div>

      ${Object.entries(o.extra).filter(([k])=>!/^additional_charges\./.test(k)).map(([k,v])=>`<div class="rowx"><span>${h(k)}</span><span style="white-space:pre-wrap">${h(v)}</span></div>`).join('')}

/* textareas that grow with their text (long wishcards from WhatsApp), with a character count */
function grow(t){if(!t)return;t.style.height='auto';t.style.height=(t.scrollHeight+4)+'px';let c=t.nextElementSibling;if(!c||!c.classList.contains('gcount')){c=document.createElement('span');c.className='mini gcount';c.style.cssText='display:block;text-align:right';t.after(c)}c.textContent=t.value.length+' aksara'}
document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('textarea[data-grow]'))grow(e.target)});

  el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{f=b.dataset.f;Orders(el)});
  let tm;$('#qs').oninput=e=>{qs=e.target.value;clearTimeout(tm);tm=setTimeout(load,300)};

    const LG=j.legacy||[];
    $('#ol').innerHTML=(j.rows.length||LG.length)?j.rows.map(o=>`<button class="ord" data-id="${o.id}">
      <div><span class="c">${h(o.code)}</span> ${pill(o)}<div class="m">Hantar <b style="color:var(--ink)">${fmtD(o.del_date)}</b> · ${h(delTxt(o))}</div>
       ${o.progress?`<span class="pg">${h(o.progress)}</span>`:''}${(o.need||[]).map(t=>`<span class="pg" style="background:var(--warnb);color:var(--warn)">${h(t)}</span>`).join(' ')}${o.issue?`<span class="pg ${o.issue==='open'?'pbad':'pok'}">${o.issue==='open'?'⚠️ Masalah':'✅ Masalah selesai'}</span>`:''}<div class="m">${srcChip(o.src)}${o.lang==='en'?' 🇬🇧':''} Untuk ${h(o.r_name)} (${h(o.r_post)}) · ${h(CAT.bq[o.bouquet]||o.bouquet)}${o.voucher?' · 🎟️ '+h(o.voucher):''}${o.notes?' · 📝':''}</div></div>
      <div class="r"><div class="t">${rm(o.total)}</div><div class="m">Order ${fmtDT(o.created_at)}</div></div></button>`).join('')+LG.map(o=>olRow(o)).join('')
      :`<div class="empty">Tiada order${f==='today'?' untuk dihantar hari ini':''}.</div>`;
    $('#ol').querySelectorAll('.ord[data-id]').forEach(b=>b.onclick=()=>openOrder(+b.dataset.id,load));bindOl($('#ol'),load);

function afterCard(o){
  if(o.pay_status!=='paid'||o.status==='batal')return '';
  const a=o.aftercare||{},i=o.issue,R=o.issue_reasons||{},dlv=['sampai','selesai'].includes(o.status),open=i&&!i.resolved;
  let st;
  if(open)st=`<div class="msg bad" style="margin:0 0 10px">⚠️ Ada masalah. Mesej automatik <b>tidak</b> dihantar. Team sales follow up secara manual di bawah.</div>`;
  else if(a.buyer_manual_at&&a.rcp_manual_at)st=`<div class="msg ok" style="margin:0 0 10px">✅ Pembeli &amp; penerima dah dihantar secara manual. Mesej automatik takkan dihantar lagi (tiada mesej berganda).</div>`;
  else if(a.auto_at)st=`<div class="msg ok" style="margin:0 0 10px">✅ Mesej selepas hantar diproses ${fmtDT(a.auto_at)}${a.buyer_manual_at||a.rcp_manual_at?` (yang dah dihantar manual tak dihantar semula)`:''}</div>`;
  else if(!dlv||!o.after_due)st=`<p class="mini" style="margin:0 0 10px">Selepas runner tekan <b>Dah sampai</b>, mesej terima kasih (pembeli) dan halaman hadiah (penerima) dihantar automatik ${o.wa_on?'30 minit kemudian':'— WhatsApp automatik belum disambung, guna butang manual'}. Kalau ada masalah, tandakan dulu supaya mesej automatik tak keluar.</p>`;
  else if(!o.after_auto)st=`<p class="mini" style="margin:0 0 10px">Order ni dihantar sebelum ciri ni aktif. Mesej automatik tak dihantar. Guna butang manual jika perlu.</p>`;
  else if(!o.wa_on)st=`<div class="msg bad" style="margin:0 0 10px">WhatsApp automatik belum disambung / dimatikan. Hantar manual guna butang di bawah.</div>`;
  else st=`<p class="mini" style="margin:0 0 10px">⏳ Mesej automatik dijadualkan sekitar <b>${fmtDT(o.after_due)}</b>. Ada masalah? Tandakan sebelum masa tu.${a.buyer_manual_at||a.rcp_manual_at?` <b>${a.buyer_manual_at?'Pembeli':'Penerima'}</b> dah dihantar manual, jadi takkan dihantar lagi secara automatik.`:' Kalau awak tekan butang di bawah, mesej automatik untuk orang tu dibatalkan (tak berganda).'}</p>`;
  const info=[a.buyer_manual_at?`Terima kasih (manual) ${fmtDT(a.buyer_manual_at)}`:'',a.gift?`🎁 Hadiah dituntut: <b>${h(a.gift.code)}</b> (${a.gift.choice==='rm10'?'RM10 off':'1 polaroid'})`:a.offer?'🎁 Hadiah belum dituntut':'',

  const chk=k=>i&&(i.reasons||[]).includes(k)?' checked':'';
  return `<div class="card" id="acard"><h2>🤝 Selepas hantar</h2>${st}
   ${info.length?`<div class="mini" style="margin:0 0 10px;line-height:1.7">${info.join('<br>')}</div>`:''}

     ${i.voucher?`<div style="margin-top:6px">🎟️ Voucher maaf <b>${h(i.voucher)}</b> (RM30, sah hingga ${fmtD(i.voucher_ends)})</div>`:''}

    <p class="mini" style="margin:6px 0 0">Tanda "Tiada gambar penerima" membolehkan runner tekan Dah sampai tanpa gambar.</p></details></div>`}
async function openOrder(id,reload){

  const ph=(n,dl)=>`photo.php?o=${encodeURIComponent(o.code)}&f=${encodeURIComponent(n)}${dl?'&dl=1':''}`;
  const wa=(n,t)=>'https://api.whatsapp.com/send?phone='+n.replace(/\D/g,'').replace(/^0/,'60')+(t?'&text='+encodeURIComponent(t):'');
  const cakeTxt=o.cake+(o.cake_flavours&&o.cake_flavours.length?` → pilihan: ${o.cake_flavours.join(' / ')}`:'');

/* ---------- WhatsApp form paste helpers (+ Order) ---------- */
const PASTE_KEYS=[[/^(occasion|momen|majlis|sempena)/,'occ'],[/^(bouquet|bunga|jambak)/,'bq'],[/^(wrap|balut)/,'bqn'],[/^(balloon|belon)/,'bal'],[/^(cake|kek)/,'cake'],
  [/^(nama\s*)?(pemberi|pembeli|pengirim)|^sender\s*name|^your\s*name/,'bname'],[/^(no\.?\s*)?(tel|telefon|phone|hp|whatsapp|wa)\.?\s*(no\.?\s*)?(pemberi|pembeli|pengirim)/,'bphone'],
  [/^(nama\s*)?penerima|^receiver\s*name|^recipient/,'rname'],[/^(no\.?\s*)?(tel|telefon|phone|hp)\.?\s*(no\.?\s*)?penerima|^receiver\s*phone/,'rphone'],
  [/^alamat|^address/,'raddr'],[/^pos\s*kod|^poskod|^postcode/,'rpost'],[/^tarikh|^date|^hari/,'date'],[/^(masa|slot|time|waktu)/,'slot'],
  [/^(kad|ucapan|wish|card)/,'wish'],[/^(daripada|dari|from)/,'sender']];
function pasteParse(t){const F={};let cur=null;
  for(const raw of String(t).replace(/\r/g,'').split('\n')){const line=raw.replace(/[*_~]/g,'').trim();
    const m=line.match(/^([A-Za-z][A-Za-z0-9 ./()&-]{1,45}?)\s*[:：=]\s*(.*)$/);let key=null;
    if(m){const lab=m[1].toLowerCase().replace(/\s+/g,' ').trim();for(const [re,k] of PASTE_KEYS)if(re.test(lab)){key=k;break}}
    if(key){cur=key;F[key]=(m[2]||'').trim();continue}
    if(m&&!key){cur=null;continue}
    if(cur&&line){F[cur]=(F[cur]?F[cur]+'\n':'')+line}else if(!line&&cur&&cur!=='wish')cur=null;}
  for(const k in F)F[k]=F[k].trim();return F}
const pasteNorm=x=>String(x).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,' ').trim();
function pasteMatch(sel,val){const v=pasteNorm(val);if(!v)return null;const code=(String(val).match(/\b([A-Za-z]{1,3}\d{2,3})\b/)||[])[1];let best=null,score=0;
  for(const o of sel.options){if(!o.value)continue;const t=pasteNorm(o.text),name=pasteNorm(o.text.replace(/^[A-Za-z]{1,3}\d{2,3}\s*-\s*/,''));let sc=0;

/* shrink a photo in the browser (keeps uploads small for the hosting limit) */
const shrink=(f,max=1200)=>new Promise(res=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b||f),'image/jpeg',max>1200?.92:.85)};im.onerror=()=>res(f);im.src=u});

    if($('#wax'))$('#wax').onclick=async()=>{if(!confirm('Buang API key? Notifikasi WhatsApp akan berhenti.'))return;await api('waset',{method:'POST',body:{clear_key:1}});Acc(el)};
    $('#wasv').onclick=async()=>{const on={};el.querySelectorAll('[data-wa]').forEach(c=>on[c.dataset.wa]=c.checked);
      try{await api('waset',{method:'POST',body:{session:$('#wan').value,session2:$('#wan2').value,session_agent:$('#wan3').value,by_user:Object.fromEntries([...el.querySelectorAll('.wsel')].map(s=>[s.dataset.user,s.value])),team:$('#wat').value,on}});toast('Tetapan WhatsApp disimpan')}catch(e){toast(e.message)}};
    $('#wts2').onclick=async()=>{try{await api('watest',{method:'POST',body:{to:$('#wtn').value,second:1}});toast('Mesej ujian dihantar dari nombor pelanggan.')}catch(e){toast(e.message)}};
    $('#wts').onclick=async()=>{$('#wts').disabled=true;try{await api('watest',{method:'POST',body:{to:$('#wtn').value}});toast('Mesej ujian dihantar. Semak WhatsApp.')}catch(e){toast(e.message)}$('#wts').disabled=false;
      const w=await api('waset');if(w.last)$('#wal').innerHTML=`Mesej terakhir ${fmtDT(w.last.at)} ke ${h(w.last.to)}: ${w.last.ok?'<b style="color:var(--ok)">berjaya</b>':`<b style="color:var(--bad)">gagal</b> (${h(w.last.error||'')})`}`};
    if(/^sess_|^official:/.test($('#wan').value))sess();
  }
  if($('#bzs'))$('#bzs').onclick=async()=>{const b={};['name','reg','phone','email','addr'].forEach(k=>b[k]=$('#bz_'+k).value);try{await api('biz',{method:'POST',body:b});toast('Maklumat syarikat disimpan')}catch(e){toast(e.message)}};
  if($('#olc')){
    const out=t=>$('#olo').innerHTML=t;
    $('#ols').onclick=async()=>{try{await api('olset',{method:'POST',body:{email:$('#ole').value,token:$('#olt').value}});$('#olt').value='';toast('Disimpan');Acc(el)}catch(e){toast(e.message)}};
    $('#olx').onclick=async()=>{out('<p class="mini">Menghubungi Orderla…</p>');try{const r=await api('oltest');
      out(`<div class="msg ok">Sambungan berjaya. ${r.count} order dalam 30 hari lepas.</div><p class="mini" style="margin:8px 0 4px"><b>Medan tambahan dijumpai</b> (nama sahaja): ${Object.entries(r.extra).map(([k,n])=>`${h(k)} <span style="opacity:.6">(${n})</span>`).join(' · ')||'tiada'}</p>
        <p class="mini" style="margin:4px 0"><b>Medan berbentuk tarikh</b>: ${Object.entries(r.dates||{}).map(([k,v])=>`${h(k)} = <code>${h(v)}</code>`).join(' · ')||'tiada'}</p>
        <p class="mini" style="margin:4px 0"><b>Halaman butiran order</b>: medan tambahan ${h((r.detail_keys||[]).join(', ')||'tiada')}${Object.keys(r.detail_dates||{}).length?' · tarikh: '+Object.entries(r.detail_dates).map(([k,v])=>`${h(k)} = <code>${h(v)}</code>`).join(' · '):''}</p>
        <p class="mini" style="margin:0">Tarikh hantar dikenal pasti dalam ${r.guess.date}/${r.count} order · nama penerima dalam ${r.guess.receiver}/${r.count} order. Kalau angka ni rendah, screenshot kotak ni dan hantar kepada Claude untuk dihalusi.</p>`)}catch(e){out(`<div class="msg bad">${h(e.message)}</div>`)}};
    const run=async months=>{const btns=['#oli','#olr','#olx'].map(x=>$(x));btns.forEach(b=>b.disabled=true);let tot={new:0,updated:0},i=0;
      for(const m of months){i++;out(`<p class="mini">Mengimport ${m} (${i}/${months.length})… ${tot.new} baru, ${tot.updated} dikemas kini</p><div style="height:8px;background:var(--bg);border-radius:9px;overflow:hidden"><div style="height:100%;width:${Math.round(i/months.length*100)}%;background:var(--accent)"></div></div>`);
        try{const r=await api('olimport',{method:'POST',body:{m}});tot.new+=r.new;tot.updated+=r.updated}catch(e){out(`<div class="msg bad">Berhenti di ${m}: ${h(e.message)}. Tekan Import semula untuk sambung (data yang dah masuk tak berganda).</div>`);btns.forEach(b=>b.disabled=false);return}}
      btns.forEach(b=>b.disabled=false);toast('Import selesai');out(`<div class="msg ok">Selesai: ${tot.new} order baru, ${tot.updated} dikemas kini. Lihat tab Pelanggan dan Dashboard.</div>`)};
    const monthsFrom=(y,m)=>{const a=[],n=new Date();for(let d=new Date(y,m-1,1);d<=n;d.setMonth(d.getMonth()+1))a.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));return a};
    $('#olp').onclick=async()=>{$('#olp').disabled=true;try{const r=await api('olreparse',{method:'POST'});let f=r.fixed,c=0;
        for(let i=0;i<20;i++){out(`<p class="mini">Menyemak butiran order terkini… ${c} disemak, ${f} tarikh dijumpai</p>`);const e=await api('olenrich',{method:'POST'});c+=e.checked;f+=e.found;if(!e.checked||!e.left)break}
        out(`<div class="msg ok">${f} order dapat tarikh hantar (${c} butiran order disemak).</div>`)}catch(e){out(`<div class="msg bad">${h(e.message)}</div>`)}$('#olp').disabled=false};
    $('#oli').onclick=()=>{if(confirm('Import semua order Orderla dari Januari 2021? Proses ni ambil beberapa minit. Jangan tutup halaman.'))run(monthsFrom(2021,1))};
    $('#olr').onclick=()=>{const n=new Date(),p=new Date(n.getFullYear(),n.getMonth()-1,1);run(monthsFrom(p.getFullYear(),p.getMonth()+1))};
  }
  $('#pc').onclick=async()=>{try{await api('passwd',{method:'POST',body:{old:$('#po').value,new:$('#pn').value}});toast('Password ditukar');$('#po').value=$('#pn').value=''}catch(e){toast(e.message)}};
}
/* show / hide password: adds an eye button to every password field, including ones rendered later */
(()=>{const EYE='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  OFF='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.9 3.8M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></svg>';
  const deco=root=>root.querySelectorAll('input[type=password]:not([data-eye])').forEach(i=>{i.dataset.eye=1;
    const w=document.createElement('span');w.className='pwrap';i.parentNode.insertBefore(w,i);w.appendChild(i);
    const b=document.createElement('button');b.type='button';b.className='eye';b.innerHTML=EYE;b.setAttribute('aria-label','Tunjuk password');b.setAttribute('aria-pressed','false');
    b.onclick=()=>{const show=i.type==='password';i.type=show?'text':'password';b.innerHTML=show?OFF:EYE;b.setAttribute('aria-label',show?'Sorok password':'Tunjuk password');b.setAttribute('aria-pressed',String(show));i.focus()};
    w.appendChild(b)});
  new MutationObserver(()=>deco(document)).observe(document.body,{childList:true,subtree:true});deco(document);})();
/* ---------- prayer times countdown (JAKIM e-Solat, zone set on the server; default SGR03 Klang & Kuala Langat) ---------- */
let SOL=null,solT=null,solDay='';
const SOL_N=[['fajr','Subuh'],['syuruk','Syuruk'],['dhuhr','Zohor'],['asr','Asar'],['maghrib','Maghrib'],['isha','Isyak']];
const myNow=()=>new Date(Date.now()+(480+new Date().getTimezoneOffset())*6e4); // Malaysia wall-clock time, whatever the device timezone
const solYmd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const at=(ymd,hm)=>{const [Y,M,D]=ymd.split('-').map(Number),[h,m]=hm.split(':').map(Number);return new Date(Y,M-1,D,h,m)};
const t12=hm=>{let [h,m]=hm.split(':').map(Number);const p=h<12?'pg':h<14?'tgh':h<19?'ptg':'mlm';h=h%12||12;return `${h}:${String(m).padStart(2,'0')} ${p}`};
async function solatLoad(){try{SOL=await api('solat');solDay=solYmd(myNow())}catch(e){SOL=null}}
function solState(){
  const n=myNow(),td=solYmd(n),tm=solYmd(new Date(n.getTime()+864e5)),T=SOL&&SOL.days[td];if(!T)return null;
  const fri=n.getDay()===5,name=k=>k==='dhuhr'&&fri?'Jumaat':SOL_N.find(x=>x[0]===k)[1];
  const list=SOL_N.filter(([k])=>k!=='syuruk').map(([k])=>({k,name:name(k),t:at(td,T[k]),hm:T[k]}));
  const cur=[...list].reverse().find(p=>p.t<=n&&n-p.t<20*6e4);           // within 20 min of a prayer starting
  let nx=list.find(p=>p.t>n);
  if(!nx&&SOL.days[tm])nx={k:'fajr',name:'Subuh',t:at(tm,SOL.days[tm].fajr),hm:SOL.days[tm].fajr,tomorrow:1};
  return {n,td,T,cur,nx,name};
}
function solatTick(){
  const w=document.getElementById('solw');if(!w)return;
  if(SOL&&solDay!==solYmd(myNow())){solatLoad().then(solatTick);return}
  const S=solState();
  if(!S){w.innerHTML='';return}
  const btn=w.querySelector('.solat')||(()=>{w.innerHTML='<button class="solat" aria-haspopup="true" aria-expanded="false"></button>';const b=w.querySelector('.solat');b.onclick=e=>{e.stopPropagation();solatPop()};return b})();
  let html;
  if(S.cur){btn.classList.add('now');html=`<span class="ic">🕌</span><span>Masuk waktu <b>${S.cur.name}</b></span><span class="lbl">${t12(S.cur.hm)}</span>`;}
  else if(S.nx){btn.classList.remove('now');const ms=S.nx.t-S.n,s=Math.floor(ms/1e3),hh=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;
    const cd=hh?`${hh}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`:`${mm}:${String(ss).padStart(2,'0')}`;
    html=`<span class="ic">🕌</span><b>${S.nx.name}</b><span class="lbl">${t12(S.nx.hm)}${S.nx.tomorrow?' esok':''}</span><span class="cd" aria-label="lagi ${hh} jam ${mm} minit">−${cd}</span>`;}
  if(btn.dataset.h!==html){btn.innerHTML=html;btn.dataset.h=html}
}
function solatPop(){
  const w=document.getElementById('solw');let pop=w.querySelector('.solpop');if(pop){pop.remove();return}
  const S=solState();if(!S)return;
  pop=document.createElement('div');pop.className='solpop';
  pop.innerHTML=`<p style="margin-top:0;font-weight:700;color:var(--ink);font-size:13px">Waktu solat hari ini</p>`+SOL_N.map(([k])=>{const t=at(S.td,S.T[k]);return `<div class="r ${S.nx&&!S.nx.tomorrow&&S.nx.k===k?'nx':''} ${t<=S.n&&!(S.cur&&S.cur.k===k)?'past':''}"><span>${S.name(k)}</span><b>${t12(S.T[k])}</b></div>`}).join('')
    +`<p>Zon ${h(SOL.zone)}${SOL.zone==='SGR03'?' · Klang & Kuala Langat':''} · ${h(SOL.source)}</p>`;
  w.appendChild(pop);
  setTimeout(()=>document.addEventListener('click',function off(ev){if(!pop.contains(ev.target)){pop.remove();document.removeEventListener('click',off)}}),0);
}
async function solatInit(){if(!SOL)await solatLoad();solatTick();if(!solT)solT=setInterval(solatTick,1000)}
/* ---------- skins ---------- */
const SKINS=[['bunga','Bunga','Default 100 Blooms',['#8e1b2f','#f7f1f3','#3b2732']],['api','Semangat Api','Oren bertenaga, gaya ninja',['#e8611a','#211915','#f8f1ea']],
  ['angin','Angin Wuxia','Kertas beras, dakwat & jed',['#2e6b5b','#1d2523','#b23a2e']],['tenang','Chill Tenang','Sage lembut, tenang di mata',['#4f9580','#edf3f0','#2b3a35']]];
const SKIN_FONTS={api:'family=Russo+One&family=Rubik:wght@400;500;600;700',angin:'family=Cormorant+Garamond:wght@600;700&family=Noto+Sans:wght@400;500;600;700',tenang:'family=Quicksand:wght@500;600;700&family=Nunito:wght@400;500;600;700'};
function skinFonts(k){if(!SKIN_FONTS[k]||document.getElementById('sf-'+k))return;const l=document.createElement('link');l.id='sf-'+k;l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?'+SKIN_FONTS[k]+'&display=swap';document.head.appendChild(l)}
function curSkin(){return document.documentElement.dataset.skin||'bunga'}
function setSkin(k){if(k==='bunga')delete document.documentElement.dataset.skin;else{skinFonts(k);document.documentElement.dataset.skin=k}try{localStorage.setItem('hb_skin',k)}catch(e){}if(ME)render()}
function skinMenu(){const box=$('.skin');let pop=box.querySelector('.skinpop');if(pop){pop.remove();$('#skb').setAttribute('aria-expanded','false');return}
  pop=document.createElement('div');pop.className='skinpop';pop.setAttribute('role','menu');
  pop.innerHTML='<p>Tema admin</p>'+SKINS.map(([k,n,d,c])=>`<button role="menuitemradio" aria-checked="${curSkin()===k}" data-sk="${k}"><span class="sws">${c.map(x=>`<i style="background:${x}"></i>`).join('')}</span><span><b>${n}</b><small>${d}</small></span>${curSkin()===k?'<span class="ck">✓</span>':''}</button>`).join('')+`<button role="menuitemcheckbox" aria-checked="${!('nomascot' in document.documentElement.dataset)}" id="mtg" style="margin-top:4px;border-top:1px solid var(--line);border-radius:0 0 11px 11px"><span style="font-size:20px">🐣</span><span><b>Watak comel</b><small>${'nomascot' in document.documentElement.dataset?'Tutup · tekan untuk buka':'Buka · tekan untuk tutup'}</small></span><span class="ck">${'nomascot' in document.documentElement.dataset?'':'✓'}</span></button>`
    +'<p style="text-transform:none;letter-spacing:0;font-weight:500;margin-top:8px">Disimpan dalam browser ni sahaja.</p>';
  box.appendChild(pop);$('#skb').setAttribute('aria-expanded','true');
  pop.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>setSkin(b.dataset.sk));
  $('#mtg').onclick=()=>{const d=document.documentElement.dataset,off=!('nomascot' in d);if(off)d.nomascot='';else delete d.nomascot;try{localStorage.setItem('hb_mascot',off?'0':'1')}catch(e){}pop.remove();skinMenu()};
  setTimeout(()=>document.addEventListener('click',function off(ev){if(!pop.contains(ev.target)){pop.remove();document.removeEventListener('click',off);const sb=$('#skb');if(sb)sb.setAttribute('aria-expanded','false')}}),0);
}
skinFonts(curSkin());
boot();
</script>
