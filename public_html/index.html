<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Combo Jimat RM128: bouquet, kek Secret Recipe, balloon, polaroid dan wishcard, dihantar terus ke pintu penerima.">
<title>100 Blooms · Combo Jimat RM128</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#fbeef0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width "app" column; each step is a full screen that slides in. Background tint follows the chosen occasion. */
:root{
  --bg:#fbeef0;          /* changes per occasion */
  --bg2:#f6dbe1;
  --ink:#3b2732;         /* plum ink */
  --soft:#7d6370;
  --card:#ffffff;
  --line:#ecd6dc;
  --accent:#d94f74;      /* rose */
  --accent-ink:#ffffff;
  --ok:#2f8f63; --warn:#b7791f; --bad:#b6404f;
  --display:"Fredoka","Baloo 2",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  transition:background-color .6s ease;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.app{max-width:440px;margin:0 auto;min-height:100%;position:relative;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.blob{position:fixed;border-radius:50%;filter:blur(40px);opacity:.55;z-index:0;pointer-events:none;background:var(--bg2);transition:background-color .6s}
.blob.a{width:260px;height:260px;top:-80px;right:-80px}.blob.b{width:220px;height:220px;bottom:-60px;left:-70px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding-block:14px 8px;background:transparent}
.back{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer;flex:none}
.back:disabled{visibility:hidden}
.prog{flex:1;height:6px;border-radius:9px;background:rgba(59,39,50,.08);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:width .4s ease}
.stepn{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;padding-block:6px 120px}
.screen{display:flex;flex-direction:column;gap:16px;animation:in .45s cubic-bezier(.2,.8,.2,1)}
.screen.backward{animation:inb .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:.0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
h1,h2{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.15}h2{font-size:18px}
.sub{color:var(--soft);margin:0;font-size:14px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.footer{position:fixed;left:0;right:0;bottom:0;z-index:6;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-top:14px;
  background:linear-gradient(to top,var(--bg) 65%,transparent);transition:background .6s}
.footer .in{max-width:440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center}
.total{font-size:12px;color:var(--soft);line-height:1.2}.total b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.btn{flex:1;border:0;border-radius:18px;padding:15px 18px;font:600 16px var(--display);background:var(--accent);color:var(--accent-ink);cursor:pointer;
  box-shadow:0 8px 20px -10px var(--accent);transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;box-shadow:none;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.link{background:none;border:0;color:var(--accent);font:600 14px var(--body);cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* splash */
.splash{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#fbeef0;transition:opacity .6s}
.splash.gone{opacity:0;pointer-events:none}
.logo{text-align:center}
.logo .mark{width:92px;height:92px;margin:0 auto 14px;animation:bloom 1.2s cubic-bezier(.2,.9,.3,1.4) both}
.logo .word{font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:-.01em;animation:up .8s .5s both}
.logo .tag{color:var(--soft);font-size:13px;animation:up .8s .75s both}
@keyframes bloom{from{transform:scale(.2) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* occasion list */
.occ{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:20px;border:2px solid transparent;
  background:var(--card);color:var(--ink);font:500 15px var(--body);cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .2s}
.opt:active{transform:scale(.98)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 10px 24px -16px var(--accent)}
.opt .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.opt .ic svg{width:26px;height:26px}
.opt b{font-family:var(--display);font-weight:600;font-size:16px;display:block}
.opt small{color:var(--soft);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:500 14px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
input[type=text],input[type=tel],input[type=date],input[type=time],textarea{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font:400 15px var(--body)}
textarea{min-height:150px;resize:vertical;line-height:1.6}
.hint{font-size:12px;color:var(--soft)}
.note{font-size:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.6);color:var(--soft)}

/* chat bubble */
.bubble{background:var(--card);border-radius:22px 22px 22px 6px;padding:18px;box-shadow:0 12px 30px -22px rgba(59,39,50,.5);animation:up .5s both}
.bubble p{margin:0 0 10px}.bubble p:last-child{margin:0}
.pickrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tagp{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--bg);color:var(--ink);font-weight:600}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--soft);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}

/* grid cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;text-align:left;border-radius:22px;border:2px solid transparent;background:var(--card);padding:10px 10px 12px;cursor:pointer;color:var(--ink);font:inherit;transition:transform .15s,border-color .2s}
.card:active{transform:scale(.97)}
.card[aria-pressed="true"]{border-color:var(--accent)}
.card .art{aspect-ratio:1/1;max-width:100%;border-radius:16px;display:grid;place-items:center;margin-bottom:8px;overflow:hidden}
.card .art svg{width:82%;height:82%}
.card b{font-family:var(--display);font-weight:600;font-size:16px;display:block}
.card small{color:var(--soft);font-size:12px;display:block;line-height:1.35}
.badge{position:absolute;top:14px;left:14px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:#fff;padding:3px 8px;border-radius:99px}
.price{font-size:12px;font-weight:700;color:var(--accent);margin-top:4px;display:block}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(40,20,30,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:440px;max-height:82%;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:sheet .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px}
@keyframes sheet{from{transform:translateY(100%)}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font:600 20px var(--display);color:var(--ink);cursor:pointer}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper output{font:600 22px var(--display);min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.grouph{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:6px 0 -4px}

/* photo */
.drop{position:relative;overflow:hidden;border:2px dashed var(--accent);border-radius:24px;padding:26px 18px;text-align:center;background:rgba(255,255,255,.65);cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center}
.drop input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px;z-index:2;-webkit-appearance:none;appearance:none}
.polas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pola{background:#fff;padding:6px 6px 18px;border-radius:4px;box-shadow:0 8px 18px -10px rgba(0,0,0,.35);position:relative;animation:drop .5s cubic-bezier(.2,.9,.3,1.3) both}
.pola:nth-child(odd){transform:rotate(-3deg)}.pola:nth-child(even){transform:rotate(2.5deg)}
@keyframes drop{from{opacity:0;transform:translateY(-20px) rotate(-12deg)}}
.pola img{aspect-ratio:1/1;max-width:100%;width:100%;object-fit:cover;display:block;background:#eee}
.pola .x{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:13px;cursor:pointer}
.pola .free{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10px;color:#7d6370;font-weight:600}

/* envelope */
.env{position:relative;width:220px;height:150px;margin:88px auto 4px}
.env .bk{position:absolute;inset:0;border-radius:10px;background:#e9b8c4;visibility:visible;width:auto;height:auto;border:0}
.env .letter{position:absolute;left:14px;right:14px;top:14px;bottom:10px;background:#fffdf9;border-radius:6px;transition:transform .9s .5s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;gap:6px;padding:16px}
.env .letter i{height:6px;border-radius:4px;background:#f1dfe3;display:block}
.env .front{position:absolute;inset:0;border-radius:10px;background:linear-gradient(160deg,transparent 49.5%,#f3cbd5 50%) ,linear-gradient(200deg,transparent 49.5%,#f0c2ce 50%);z-index:2}
.env .flap{position:absolute;left:0;right:0;top:0;height:90px;background:#dc9bad;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:3;transition:transform .6s ease}
.env .seal{position:absolute;left:50%;top:70px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:var(--accent);z-index:4;transition:opacity .3s}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .seal{opacity:0}
.env.open .letter{transform:translateY(-70px)}
.sugg{display:flex;flex-direction:column;gap:10px}
.sug{text-align:left;padding:14px 16px;border-radius:18px;border:2px solid transparent;background:var(--card);font:400 14px/1.55 var(--body);color:var(--ink);cursor:pointer;white-space:pre-line}
.sug[aria-pressed="true"]{border-color:var(--accent)}
.sug em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:4px}

/* delivery */
.dopt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border-radius:18px;border:2px solid transparent;background:var(--card);cursor:pointer;font:inherit;color:var(--ink)}
.dopt[aria-pressed="true"]{border-color:var(--accent)}
.dopt:disabled{opacity:.45;cursor:default}
.dopt .r{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px}
.dopt[aria-pressed="true"] .r{border:6px solid var(--accent)}
.dopt div{flex:1;min-width:0}.dopt b{font-family:var(--display);font-weight:600}
.dopt .p{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.status{font-size:13px;padding:10px 12px;border-radius:12px;font-weight:500}
.status.ok{background:#e3f4ea;color:var(--ok)}.status.warn{background:#fbefd9;color:var(--warn)}.status.bad{background:#f8e0e3;color:var(--bad)}

.qdate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qd{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:76px;padding:8px 4px;border-radius:16px;border:2px solid transparent;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;text-align:center;transition:transform .15s,border-color .2s}
.qd:active{transform:scale(.96)}
.qd small{font-size:11.5px;color:var(--soft);line-height:1.2}
.qd b{font:600 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.qd[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.qd[aria-pressed="true"] small{color:var(--accent-ink);opacity:.9}
.qd.cal{color:var(--accent);border:2px dashed var(--line)}
.qd.cal svg{width:24px;height:24px;margin-bottom:3px}
.qd.cal[aria-pressed="true"]{border-style:solid;color:var(--accent-ink)}
.qd.cal input{position:absolute;inset:0;width:100%;height:100%;min-height:100%;opacity:0;cursor:pointer;padding:0;margin:0;border:0;border-radius:inherit;font-size:16px;color:transparent;background:transparent;z-index:2;display:block;-webkit-appearance:none;appearance:none}
.qd.cal input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;margin:0;padding:0;opacity:0;cursor:pointer;background:transparent}
.qd.cal input::-webkit-date-and-time-value{min-height:100%}
/* summary */
.sum{background:var(--card);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.row span:first-child{color:var(--soft);min-width:0}
.row span:last-child{text-align:right;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.row.tot{border-top:1.5px dashed var(--line);padding-top:10px;font-weight:700;font-size:16px}
.row.tot span{color:var(--ink)}
.edit{font-size:12px}
.qr{width:200px;height:200px;margin:0 auto;background:#fff;border-radius:16px;padding:12px;display:grid}
.qr canvas{width:100%;height:100%;image-rendering:pixelated}
.done{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding-top:30px}
.done .tick{width:84px;height:84px;border-radius:50%;background:var(--accent);display:grid;place-items:center;animation:bloom .8s both}
.proto{font-size:11px;text-align:center;color:var(--soft);margin-top:4px}
/* path preview (non-interactive) */
.path{display:flex;align-items:flex-start;justify-content:space-between;position:relative;padding:4px 2px 0}
.path::before{content:"";position:absolute;left:22px;right:22px;top:21px;border-top:2px dashed var(--bg2)}
.path span{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--soft);width:20%;text-align:center}
.path i{width:36px;height:36px;border-radius:50%;background:var(--bg);border:2px solid var(--bg2);display:grid;place-items:center;font:700 13px var(--display);color:var(--accent);font-style:normal}
.path span:first-child i{background:var(--accent);border-color:var(--accent);color:#fff}
.path span:first-child{color:var(--ink);font-weight:600}
.btn.nudge{animation:nudge 1.6s ease-in-out infinite}
.footer .in{position:relative}
.arrow{position:absolute;left:50%;top:-34px;margin-left:-14px;width:28px;height:28px;color:var(--accent);animation:bob 1.1s ease-in-out infinite;pointer-events:none}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(8px);opacity:1}}
@keyframes nudge{0%,100%{transform:scale(1);box-shadow:0 8px 20px -10px var(--accent)}50%{transform:scale(1.04);box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 22%,transparent)}}
.cdel{margin-top:4px;padding:4px 10px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--bad);font:600 12px var(--body);cursor:pointer}
.cartbtn{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:8px 12px;text-align:left;cursor:pointer;font-family:var(--body);flex:none}
.cartbtn .cv{color:var(--accent);font-weight:700;font-size:11px;margin-left:4px}
/* bouquet photos + detail sheet */
.card .art.photo{aspect-ratio:4/5}
.card .art img{width:100%;height:100%;object-fit:contain;padding:4px}
.card .peek.low{top:40px;left:14px;right:auto}
.card .peek{position:absolute;top:14px;right:14px;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.92);color:var(--ink);padding:3px 8px;border-radius:99px}
.sheet>*{flex-shrink:0}
.gal{display:flex;flex:none;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;margin:0 -2px;padding-bottom:4px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal figure{flex:0 0 78%;margin:0;scroll-snap-align:center;border-radius:20px;overflow:hidden;background:var(--bg);position:relative}
.gal img{display:block;width:100%;aspect-ratio:4/5;max-width:100%;object-fit:cover}
.gal figure.prod img{object-fit:contain;background:#fff;padding:10px}
.gal figcaption{position:absolute;left:10px;bottom:10px;font-size:11px;font-weight:700;background:rgba(255,255,255,.92);color:var(--ink);padding:4px 10px;border-radius:99px}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent);width:16px;border-radius:4px}
.trust{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:18px;padding:14px}
.trust div{display:flex;gap:10px;font-size:13px;align-items:flex-start}
.trust svg{flex:none;width:18px;height:18px;margin-top:1px}
.wa{font-size:12.5px;color:var(--soft);text-align:center}
.wa a{color:var(--accent);font-weight:600}
/* intro */
.hero{background:var(--card);border-radius:28px;padding:22px 20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.hero .pr{font-family:var(--display);font-weight:700;font-size:54px;line-height:1;color:var(--accent);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero .pr small{font-size:18px;font-weight:600;vertical-align:top;margin-right:2px}
.hero .flr{position:absolute;right:-18px;top:-18px;width:120px;height:120px;opacity:.9;animation:bloom 1.2s .3s both}
.items{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.items li{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:10px 12px;animation:up .5s both}
.items li:nth-child(2){animation-delay:.08s}.items li:nth-child(3){animation-delay:.16s}.items li:nth-child(4){animation-delay:.24s}.items li:nth-child(5){animation-delay:.32s}
.items .n{width:30px;height:30px;border-radius:10px;background:var(--bg2);color:var(--accent);font:700 14px var(--display);display:grid;place-items:center;flex:none}
.items b{font-family:var(--display);font-weight:600;display:block;font-size:15px}
.items small{color:var(--soft);font-size:12.5px}
.perks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.perk{background:rgba(255,255,255,.7);border-radius:16px;padding:12px;font-size:12.5px;color:var(--soft)}
.perk b{display:block;color:var(--ink);font-family:var(--display);font-weight:600;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const STEPS=['intro','occ','who','call','hello','bq','bal','cake','photo','wish','recv','del','sum','pay','done'];

function render(){
  setTheme();
  // a saved selection may have gone out of stock since: send the customer back to choose again
  if(S.step<STEPS.indexOf('pay'))for(const [k,ok] of [['bq',()=>S.bq&&!isOff('bq',S.bq)],['bal',()=>S.bal&&!isOff('bal',S.bal)],['cake',()=>S.cake&&!isOff('cake',S.cake)]])
    if(S.step>STEPS.indexOf(k)&&!ok()){S.step=STEPS.indexOf(k);break;}
  const k=STEPS[S.step];
  $('#back').disabled=S.step===0||k==='done';
  const pct=Math.min(S.step,COUNTED)/COUNTED*100;
  $('#bar').style.width=pct+'%';
  $('#stepn').textContent=k==='done'?'':(Math.min(S.step+1,COUNTED+1))+'/'+(COUNTED+1);
  const m=$('#main');m.innerHTML='';
  const sc=document.createElement('section');sc.className='screen'+(dir<0?' backward':'');
  m.appendChild(sc);

  window.scrollTo({top:0});
  save();
}

    ${flowers}<path d="M24 40 L50 92 L76 40 Z" fill="${b.wr}" stroke="rgba(0,0,0,.12)"/><path d="M30 40 L50 80 L70 40" fill="none" stroke="rgba(255,255,255,.25)"/>
    <path d="M42 72 q8 -6 16 0 q-8 6 -16 0z" fill="${b.rb}"/><path d="M48 74 l-5 12M52 74 l5 12" stroke="${b.rb}" stroke-width="2.4"/>${bal}</svg>`;
}
function balArt(c){return `<svg viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="40" rx="24" ry="28" fill="${c}"/><ellipse cx="42" cy="30" rx="6" ry="9" fill="rgba(255,255,255,.4)"/><path d="M47 68h6l-3 4z" fill="${c}"/><path d="M50 72 q-6 10 2 18" stroke="#999" fill="none"/></svg>`}
function balCard(b){const u=(window.IMG&&IMG.bal&&IMG.bal[b.id])||'assets/img/balloon/'+b.id+'.webp';return `<button class="card" data-id="${b.id}" aria-pressed="${S.bal===b.id}"><div class="art photo" style="background:#fff">${u?`<img src="${u}" alt="Balloon ${h(b.t)}" loading="lazy">`:balArt(b.c||'#ddd')}</div><b style="font-size:14px">${h(b.t)}</b></button>`}
function bindBal(scope){scope.querySelectorAll('.card[data-id]').forEach(c=>c.onclick=()=>{S.bal=c.dataset.id;save();closeSheet();render();});}
function sheet(html){const L=$('#layer');L.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  $('#scrim').onclick=e=>{if(e.target.id==='scrim')closeSheet()};return L;}
function closeSheet(){$('#layer').innerHTML=''}
function allBalloons(){
  const L=sheet(`<h2>Semua balloon</h2><p class="sub">Disusun ikut tema. Tekan untuk pilih.</p>`+BAL_GRP.map(g=>{const items=BALLOON.filter(b=>b.grp===g&&!isOff('bal',b.id));if(!items.length)return '';
    return `<div class="grouph">${g}</div><div class="grid">${items.map(balCard).join('')}</div>`}).join(''));
  bindBal(L);
}
function cakeCard(c,up){const u=window.IMG&&IMG.cake&&IMG.cake[c];return `<button class="card" data-id="${h(c)}" aria-pressed="${S.cake===c}"><div class="art" style="background:${u?'#fff':up?'#f6e3e8':'#f3ebe4'};aspect-ratio:${u?'3/2':'2/1'}">${u?`<img src="${u}" alt="${h(c)}" loading="lazy" style="object-fit:cover;padding:0">`:`
  <svg viewBox="0 0 100 50" aria-hidden="true"><path d="M20 38 L80 38 L80 22 L20 30Z" fill="${/Red/.test(c)?'#b8323f':/Carrot/.test(c)?'#d9894a':/lain/.test(c)?'#e8b04f':'#5b3424'}"/><path d="M20 30 L80 22 L68 14 L20 26Z" fill="#fff4ea"/><path d="M20 34 L80 30" stroke="#fff4ea" stroke-width="2"/></svg>`}</div>
  <b style="font-size:14px">${h(c)}</b><span class="price">${up?'+RM10':'Percuma'}</span></button>`}
function extraCake(){
  const e=Object.assign({},S.extraCakes||{}),MAX=10,tot=()=>Object.values(e).reduce((a,b)=>a+b,0);
  const row=(c,i)=>`<div class="row" style="align-items:center"><span><b style="font-weight:600;color:var(--ink)">${h(c)}</b></span>
    <span class="stepper" style="gap:10px"><button data-i="${i}" data-d="-1" aria-label="Kurang ${h(c)}">−</button><output id="n${i}">${e[c]||0}</output><button data-i="${i}" data-d="1" aria-label="Tambah ${h(c)}">+</button></span></div>`;
  const C=ALL_CAKES();
  sheet(`<h2>Tambah kek</h2><p class="sub">Pilih perisa yang awak nak, boleh campur-campur. RM20 sepotong untuk semua perisa, maksimum ${MAX} kek tambahan. Team kami akan sahkan perisa ikut stok.</p>
   <div class="sum" style="padding:0;gap:8px">${C.map(row).join('')}</div>
   <div class="row tot"><span>Kek tambahan: <b id="nt0">0</b></span><span id="nt">RM0</span></div>
   <button class="btn" id="okc">Simpan</button>`);
  const up=()=>{C.forEach((c,i)=>$('#n'+i).textContent=e[c]||0);$('#nt0').textContent=tot();$('#nt').textContent=rm(tot()*20);
    document.querySelectorAll('#scrim .stepper button').forEach(b=>{const c=C[b.dataset.i];b.disabled=b.dataset.d>0?tot()>=MAX:!(e[c]>0)});};
  document.querySelectorAll('#scrim .stepper button').forEach(b=>b.onclick=()=>{const c=C[b.dataset.i],d=+b.dataset.d;
    if(d>0&&tot()>=MAX)return;e[c]=Math.max(0,(e[c]||0)+d);if(!e[c])delete e[c];up()});
  up();
  $('#okc').onclick=()=>{S.extraCakes=e;S.extraCake=tot();save();closeSheet();render()};
}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtShort(s){const d=new Date(s+'T00:00');return d.toLocaleDateString('ms-MY',{day:'numeric',month:'short'})}
function fmtDate(s){if(!s)return'-';const d=new Date(s+'T00:00');return d.toLocaleDateString('ms-MY',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
function specErr(v,isToday,now){
  if(!v)return'';const [H,M]=v.split(':').map(Number),t=H+M/60;
  if(t<9||t>22)return'Masa khusus hanya antara 9 pagi hingga 10 malam.';
  if(isToday&&t<now.getHours()+now.getMinutes()/60+5)return'Masa khusus perlu ditempah sekurang-kurangnya 5 jam awal. Pilih masa lebih lewat.';
  return'';
}
function _unusedQR(cv){const x=cv.getContext('2d'),n=29;x.fillStyle='#fff';x.fillRect(0,0,n,n);x.fillStyle='#2b1d24';
  let s=total()*7+13;const rnd=()=>(s=(s*9301+49297)%233280)/233280;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(rnd()>.52)x.fillRect(i,j,1,1);
  [[0,0],[n-7,0],[0,n-7]].forEach(([a,b])=>{x.fillStyle='#2b1d24';x.fillRect(a,b,7,7);x.fillStyle='#fff';x.fillRect(a+1,b+1,5,5);x.fillStyle='#2b1d24';x.fillRect(a+2,b+2,3,3)});}

/* ---------- order submission ---------- */
function dataUrlToBlob(u){const [m,b]=u.split(',');const bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:(m.match(/:(.*?);/)||[])[1]||'image/jpeg'})}
let submitting=false;
async function submitOrder(){
  if(submitting)return;submitting=true;
  const err=msg=>{submitting=false;$('#pst').textContent='';$('#perr').innerHTML=`<div class="status bad">${h(msg)}</div>
    <button class="btn" id="retry" style="flex:none;width:100%;margin-top:12px">Cuba lagi</button><button class="btn ghost" id="bk2" style="flex:none;width:100%;margin-top:8px">Kembali ke ringkasan</button>`;
    $('#retry').onclick=()=>{$('#perr').innerHTML='';$('#pst').textContent='Cuba sekali lagi…';submitOrder()};$('#bk2').onclick=()=>{dir=-1;S.step=STEPS.indexOf('sum');render()};};
  const d=Object.assign({},S);delete d.photos;delete d.step;
  d.ref=getRef();
  try{d.test=sessionStorage.getItem('hb_test')||''}catch(e){}
  d.call=callName();
  const fd=new FormData();fd.append('data',JSON.stringify(d));
  S.photos.forEach((u,i)=>fd.append('photo[]',dataUrlToBlob(u),'p'+(i+1)+'.jpg'));
  let r,j;
  if(HQ)return hqSubmit(fd,err);
  try{r=await fetch('api/order.php',{method:'POST',body:fd});j=await r.json().catch(()=>({}));}
  catch(e){return err('Tiada sambungan internet. Semak sambungan dan cuba lagi.');}
  if(j.payUrl){try{localStorage.setItem('hb_last',JSON.stringify({code:j.code}))}catch(e){}$('#pst').textContent='Membuka halaman bayaran…';location.href=j.payUrl;return;}
  if(j.code){submitting=false;$('#pst').textContent='';$('#perr').innerHTML=`<div class="status bad">${h(j.error||'Halaman bayaran tak dapat dibuka.')}</div><a class="btn" style="display:block;flex:none;width:100%;margin-top:12px;text-align:center;text-decoration:none" href="https://api.whatsapp.com/send?phone=${CAT.wa||'601165862584'}&text=${encodeURIComponent('Hai 100 Blooms, saya nak bayar order '+j.code)}" target="_blank" rel="noopener">WhatsApp kami</a>`;return;}
  err(j.error||'Order tak dapat dihantar. Cuba lagi sebentar.');
}
async function checkReturn(code,k,tries){
  try{const r=await fetch('api/status.php?code='+encodeURIComponent(code)+'&k='+encodeURIComponent(k));const j=await r.json();
    if(r.ok){window.RESULT=Object.assign(j,{k});if(j.paid){S=blank();save();}S.step=STEPS.indexOf('done');render();
      if(!j.paid&&tries<8)setTimeout(()=>checkReturn(code,k,tries+1),tries<3?3000:6000);return;}}catch(e){}
  window.RESULT={code};S.step=STEPS.indexOf('done');render();
}

/* ---------- Sales HQ ---------- */
async function hqSubmit(fd,err){
  let r,j;
  try{r=await fetch('admin/api.php?a=hqorder',{method:'POST',body:fd,headers:{'X-CSRF':HQ.csrf},credentials:'same-origin'});j=await r.json().catch(()=>({}));}
  catch(e){return err('Tiada sambungan internet. Semak sambungan dan cuba lagi.');}
  if(r.status===401||r.status===419){submitting=false;hqLogin(()=>{$('#perr').innerHTML='';submitOrder()});return err('Sesi tamat. Log masuk semula, kemudian tekan Cuba lagi.');}
  if(!j.code)return err(j.error||'Order tak dapat disimpan. Cuba lagi.');
  submitting=false;S=blank();save();hqDone(j);
}
function hqDone(j){
  const wa=`https://api.whatsapp.com/send?phone=${j.b_phone}&text=${encodeURIComponent(j.invoice)}`;
  $('#back').disabled=true;$('#foot').innerHTML='';
  $('#main').innerHTML=`<div class="done"><div class="tick"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1>Order ${h(j.code)} disimpan</h1><p class="sub">Jumlah <b>${rm(j.total)}</b> · ${h(j.b_name)} (+${h(j.b_phone)})<br>Langkah terakhir: hantar invoice ke WhatsApp pembeli.</p>
    ${j.warn?`<div class="status warn" style="width:100%">${h(j.warn)}</div>`:''}
    <a class="btn hqwa" href="${h(wa)}" target="_blank" rel="noopener" style="display:block;flex:none;width:100%;text-decoration:none;text-align:center">📲 Hantar invoice ke WhatsApp pembeli</a>
    <button class="btn ghost" id="hqcp" style="flex:none;width:100%">Salin invoice</button>
    ${j.doc?`<a class="btn ghost" href="${h(j.doc)}" target="_blank" rel="noopener" style="display:block;flex:none;width:100%;text-decoration:none;text-align:center">🧾 Invoice PDF</a>`:''}
    <details class="hqinv" style="width:100%;text-align:left"><summary>Lihat invoice</summary><pre>${h(j.invoice)}</pre></details>
    <button class="btn ghost" id="hqnew" style="flex:none;width:100%">＋ Order baru</button>
    <p class="hint" style="margin:0">Status bayaran dikemas kini sendiri bila pembeli bayar online. Bayaran QR bank: sahkan di <a href="admin/" target="_blank" rel="noopener">admin</a>.</p></div>`;
  $('#hqcp').onclick=async()=>{try{await navigator.clipboard.writeText(j.invoice);$('#hqcp').textContent='✓ Invoice disalin'}catch(e){$('.hqinv').open=true}};
  $('#hqnew').onclick=()=>{S=blank();save();dir=1;render();scrollTo(0,0)};
}
function hqBar(){
  let b=document.getElementById('hqbar');if(!b){b=document.createElement('div');b.id='hqbar';b.className='hqbar';document.body.prepend(b);}
  b.innerHTML=HQ.user?`🧑‍💼 <b>Sales HQ</b> · ${h(HQ.user.name)} <span class="sp"></span><a href="admin/" target="_blank" rel="noopener">Admin</a> · <a href="#" id="hqout">Log keluar</a>`:'🧑‍💼 <b>Sales HQ</b> · belum log masuk';
  const o=document.getElementById('hqout');if(o)o.onclick=async e=>{e.preventDefault();try{await fetch('admin/api.php?a=logout',{method:'POST',headers:{'X-CSRF':HQ.csrf},credentials:'same-origin'})}catch(x){}HQ.user=null;hqBar();hqLogin()};
}
async function hqMe(){try{const r=await fetch('admin/api.php?a=me',{credentials:'same-origin'});if(!r.ok)return false;const j=await r.json();HQ.user=j.user;HQ.csrf=j.csrf;hqBar();return true}catch(e){return false}}
function hqLogin(then){
  const L=$('#layer');
  L.innerHTML=`<div class="hqlog" role="dialog" aria-modal="true" aria-labelledby="hqlt"><form id="hqf" class="hqcard" novalidate>
    <div style="font-size:34px;line-height:1">🧑‍💼</div><h2 id="hqlt">Log masuk Sales HQ</h2><p class="hint" style="margin:0 0 6px">Guna akaun admin awak sendiri. Setiap order disimpan atas nama awak.</p>
    <div class="field"><label for="hqe">Email</label><input id="hqe" type="email" autocomplete="username" required></div>
    <div class="field"><label for="hqp">Password</label><div class="hqpw"><input id="hqp" type="password" autocomplete="current-password" required><button type="button" id="hqeye" aria-label="Tunjuk password" aria-pressed="false">👁</button></div></div>
    <div id="hqerr"></div><button class="btn" type="submit" style="flex:none;width:100%">Log masuk</button></form></div>`;
  $('#hqeye').onclick=()=>{const i=$('#hqp'),on=i.type==='password';i.type=on?'text':'password';$('#hqeye').setAttribute('aria-pressed',on);$('#hqeye').setAttribute('aria-label',on?'Sembunyi password':'Tunjuk password')};
  $('#hqf').onsubmit=async e=>{e.preventDefault();$('#hqerr').innerHTML='';
    try{const r=await fetch('admin/api.php?a=login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:$('#hqe').value,pw:$('#hqp').value})});const j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(j.error||'Log masuk gagal.');await hqMe();L.innerHTML='';then&&then();}
    catch(x){$('#hqerr').innerHTML=`<div class="status bad">${h(x.message)}</div>`}};
  setTimeout(()=>$('#hqe').focus(),50);
}

/* ---------- boot ---------- */
if(STEPS[S.step]==='done'||STEPS[S.step]==='pay')S.step=STEPS.indexOf('sum');
(async()=>{
  try{const r=await fetch('api/catalog.php',{cache:'no-store'});if(r.ok){const j=await r.json();CAT=Object.assign(CAT,j,{t0:Date.now()});}}catch(e){}
  const P=new URLSearchParams(location.search);
  if(HQ){hqBar();if(!(await hqMe()))hqLogin();render();}
  else if(P.get('r')&&P.get('k')){checkReturn(P.get('r'),P.get('k'),0);}
  else render();
  setTimeout(()=>$('#splash').classList.add('gone'),900);
})();
</script>
